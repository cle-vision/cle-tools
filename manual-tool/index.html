:root{
  --bg:#e9edf1; --panel:#f8fafb; --ink:#1a2330; --muted:#5b6778; --line:#d3dae2;
  --chip:#e1e7ed; --view:#dfe5eb; --grid:#b9c3ce; --body:#2b3440; --bodyEdge:#6f7b8a;
  --near:#0f9d8a; --focus:#e09a00; --far:#4c6ef5; --probe:#d6336c;
  --sel:#1a2330; --selInk:#f8fafb;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12161c; --panel:#181d24; --ink:#e6ebf1; --muted:#95a1b1; --line:#2a323d;
    --chip:#222a34; --view:#0f1318; --grid:#2c3542; --body:#3a4553; --bodyEdge:#8b98a9;
    --near:#20c9b0; --focus:#ffb81f; --far:#7c96ff; --probe:#ff5c93;
    --sel:#e6ebf1; --selInk:#12161c;
  }
}
:root[data-theme="dark"]{
  --bg:#12161c; --panel:#181d24; --ink:#e6ebf1; --muted:#95a1b1; --line:#2a323d;
  --chip:#222a34; --view:#0f1318; --grid:#2c3542; --body:#3a4553; --bodyEdge:#8b98a9;
  --near:#20c9b0; --focus:#ffb81f; --far:#7c96ff; --probe:#ff5c93;
  --sel:#e6ebf1; --selInk:#12161c;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr) auto;height:100%}
.topbar{grid-column:1/-1;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.logo{display:block;height:36px;width:auto;color:var(--ink);justify-self:start}
.seg{flex:none;display:flex;height:36px;background:var(--chip);border-radius:9px;padding:3px;gap:2px;min-width:0}
.seg button{flex:none;min-width:0;height:100%;font:inherit;font-size:13.5px;font-weight:600;border:0;background:transparent;color:var(--muted);padding:0 16px;border-radius:7px;cursor:pointer;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-checked="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(20,30,45,.18)}
aside.dock{grid-row:3;background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
main.view{grid-row:2}
.dockbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:6px 16px;min-height:48px}
.handle{width:72px;height:24px;display:grid;place-items:center;border:0;background:transparent;cursor:pointer;border-radius:12px;padding:0}
.handle span{display:block;width:40px;height:5px;border-radius:3px;background:var(--grid);transition:background .15s}
.handle:hover span{background:var(--muted)}
.pngsplit{justify-self:end;position:relative;display:flex;height:36px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.pngsplit button{font:inherit;font-size:13.5px;font-weight:600;color:var(--ink);background:transparent;border:0;cursor:pointer}
.pngmain{padding:0 14px;border-radius:8px 0 0 8px}
.pngmore{width:34px;display:grid;place-items:center;border-left:1px solid var(--line)!important;border-radius:0 8px 8px 0}
.pngmore svg{transition:transform .15s}.pngmore[aria-expanded="true"] svg{transform:rotate(180deg)}
.pngsplit button:hover{background:var(--chip)}
.pngmenu{position:absolute;right:0;bottom:calc(100% + 6px);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px;box-shadow:0 6px 20px rgba(20,30,45,.16);z-index:5;white-space:nowrap}
.pngmenu[hidden]{display:none}
.pngmenu button{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:7px;font-weight:500}
.dispwrap{position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;z-index:3}
.dispbtn{width:38px;height:38px;display:grid;place-items:center;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;cursor:pointer}
.dispbtn[aria-expanded="true"]{background:var(--sel);color:var(--selInk);border-color:var(--sel)}
.disppop{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:0 6px 20px rgba(20,30,45,.16)}
.disppop[hidden]{display:none}
.disppop .bgrow{margin-top:12px}
.docktoggle-unused{display:flex;align-items:center;gap:8px;font:inherit;font-size:14px;font-weight:600;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:8px;height:36px;padding:0 12px;cursor:pointer}
.docktoggle svg{transition:transform .2s ease}
.docktoggle[aria-expanded="false"] svg{transform:rotate(180deg)}
.dockgrid .caption{margin:0 0 18px}
.dockbody{display:grid;grid-template-rows:1fr;transition:grid-template-rows .22s ease}
.dockbody.collapsed{grid-template-rows:0fr}
.dockinner{overflow:hidden;min-height:0}
.dockgrid{display:grid;grid-template-columns:minmax(280px,1fr) minmax(380px,1.6fr);gap:28px;padding:4px 20px 18px;max-height:42vh;overflow-y:auto}
.dockgrid .sec{margin-top:0}
.dockgrid h2{font-size:15px;font-weight:600;margin:0 0 10px}
h1{font-size:22px;font-weight:700;margin:0 0 22px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 22px;font-size:14px}
.models{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:26px}
.models button{font:inherit;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--chip);color:var(--ink);
  padding:7px 12px;border-radius:8px;cursor:pointer}
.models button[aria-pressed="true"]{background:var(--sel);color:var(--selInk);border-color:var(--sel)}
button:focus-visible,input:focus-visible{outline:2px solid var(--far);outline-offset:2px}
.plate{display:flex;align-items:baseline;gap:10px;margin-bottom:2px}
.plate .big{font-size:44px;font-weight:700;line-height:1}
.plate .unit{color:var(--muted);font-size:14px}
.caption{color:var(--muted);font-size:13px;margin:0 0 18px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--line)}
td{padding:9px 0;border-bottom:1px solid var(--line)}
td.r,th.r{text-align:right}
td .num{font-size:18px;font-weight:600}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;vertical-align:-1px}
.sec{margin-top:28px}
.sec h2{font-size:15px;font-weight:600;margin:0 0 10px}
.probe{background:var(--chip);border-radius:12px;padding:16px}
.probe input[type=range]{width:100%;accent-color:var(--probe);margin:10px 0 4px}
.probe .row{display:flex;justify-content:space-between;align-items:baseline}
.probe .val{font-size:30px;font-weight:700;color:var(--probe);line-height:1}
.probe .fov{font-size:24px;font-weight:600;line-height:1}
.probe small{color:var(--muted);font-size:12.5px}
.objs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.objs button{font:inherit;font-size:13.5px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 11px;border-radius:8px;cursor:pointer}
.objs button[aria-pressed="true"]{background:var(--sel);color:var(--selInk);border-color:var(--sel)}
.objinfo{font-size:13px;color:var(--muted);margin:0 0 12px}
.dims{display:none;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 12px}
.dims.on{display:grid}
.dims label{display:grid;gap:3px;font-size:12.5px;color:var(--muted)}
.dims input{font:inherit;font-size:15px;width:100%;min-width:0;padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink)}
.dims label[hidden],.objs[hidden]{display:none}
#objs{flex-wrap:nowrap;gap:5px}
#objs button{flex:1 1 auto;white-space:nowrap;font-size:12.5px;padding:5px 6px}
#shapes{padding-left:12px;border-left:2px solid var(--line)}
.status{margin-top:12px;font-size:13.5px;display:grid;gap:4px}
.status div{display:flex;gap:8px;align-items:baseline}
.status div span:first-child{white-space:nowrap}
.status .ok{color:var(--near);font-weight:600}
.status .ng{color:var(--probe);font-weight:600}
.toggles{display:flex;flex-wrap:nowrap;gap:16px;font-size:14px;white-space:nowrap}
.bgrow{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:14px}
.bgrow .sw{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);cursor:pointer;padding:0;background:var(--swc)}
.bgrow .sw[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:2px}
.bgrow .sw.auto{background:linear-gradient(135deg,#dfe5eb 50%,#0f1318 50%)}
.bgrow input[type=color]{width:30px;height:28px;border:1px solid var(--line);border-radius:7px;padding:1px;background:var(--panel);cursor:pointer}
.toggles label{display:flex;gap:6px;align-items:center;cursor:pointer}
.tright{justify-self:end;display:flex;gap:8px;align-items:center}
.pngwrap{display:flex;align-items:center;height:36px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.pngwrap .alpha{display:flex;align-items:center;gap:5px;font-size:13px;padding:0 10px;border-right:1px solid var(--line);height:100%;cursor:pointer;white-space:nowrap}
.pngwrap .cmpbtn{border:0;height:34px;background:transparent}
.seg.sm button{padding:0 12px}
.cmpbtn{flex:none;height:36px;display:inline-flex;align-items:center;font:inherit;font-size:13.5px;font-weight:600;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 13px;border-radius:8px;cursor:pointer;z-index:2}
.cmpbtn[aria-pressed="true"]{background:var(--sel);color:var(--selInk);border-color:var(--sel)}
.cmpchart{position:absolute;right:16px;top:14px;bottom:66px;width:330px;max-height:560px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 12px 10px;display:flex;flex-direction:column;box-shadow:0 4px 16px rgba(20,30,45,.10)}
.cmpchart[hidden]{display:none}
.cmpchart h3{margin:0;font-size:13.5px;font-weight:600}
.cmpbody{display:flex;flex-direction:column;flex:1;min-height:0;margin-top:8px}
.cmpbody[hidden]{display:none}
.cmpchart.folded{bottom:auto}
.rangetog{display:flex;align-items:center;gap:4px;font:inherit;font-size:12.5px;font-weight:600;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:7px;height:30px;padding:0 9px;cursor:pointer}
.rangetog svg{transition:transform .15s}.rangetog[aria-expanded="false"] svg{transform:rotate(-90deg)}
.cmphead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.seg.xs{height:30px;padding:2px}.seg.xs button{padding:0 10px;font-size:12.5px}
.plot{position:relative;flex:1;min-height:160px;display:grid;grid-template-columns:40px 1fr}
.yaxis{position:relative}
.yaxis span{position:absolute;right:6px;transform:translateY(-50%);font-size:11px;color:var(--muted)}
.cols{position:relative;display:flex;gap:6px;border-left:1px solid var(--line)}
.cols .gl{position:absolute;left:0;right:0;border-top:1px dashed var(--line);pointer-events:none}
.col{position:relative;flex:1;cursor:pointer;border-radius:6px;background:transparent;border:0;padding:0;font:inherit}
.col:hover{background:var(--chip)}
.col i{position:absolute;left:26%;right:26%;border-radius:4px;background:var(--mc);opacity:.22}
.col b{position:absolute;left:14%;right:14%;height:2px;background:var(--mc);opacity:.35}
.col.on{background:color-mix(in srgb,var(--mc) 12%,transparent);box-shadow:inset 0 0 0 2px var(--mc)}
.col.on i{left:14%;right:14%;opacity:1;box-shadow:0 0 0 2px var(--panel),0 0 10px var(--mc)}
.col.on b{left:4%;right:4%;opacity:1;height:3px;background:var(--ink)}
.cmpsel{border-radius:8px;padding:7px 9px;margin:0 0 10px;background:color-mix(in srgb,var(--mc) 14%,transparent);border-left:4px solid var(--mc)}
.cmpsel strong{display:block;font-size:14px;color:var(--mc)}
.cmpsel span{font-size:11.5px;color:var(--ink)}
.title3d .n.cmp{border-left:6px solid var(--mc);padding-left:10px}
.xlab{display:grid;grid-template-columns:40px 1fr;margin-top:6px}
.xlab div{display:flex;gap:6px}
.xlab span{flex:1;min-width:0;text-align:center;font-size:10.5px;color:var(--muted);white-space:nowrap;letter-spacing:-.02em}
.xlab span.on{color:var(--ink);font-weight:700}
.cmphint{font-size:11.5px;color:var(--muted);margin-top:6px}
.samecol{display:flex;align-items:center;gap:6px;font-size:12.5px;margin-top:8px;cursor:pointer}
@media (max-width:880px){.cmpchart{width:190px;top:12px;bottom:60px}}
.note{color:var(--muted);font-size:12.5px;margin-top:22px;line-height:1.6}
.view{position:relative;background:var(--view);overflow:hidden;touch-action:none;min-height:0}
canvas{display:block;width:100%;height:100%;cursor:grab}
canvas:active{cursor:grabbing}
.labels{position:absolute;inset:0;pointer-events:none}
.lbl{position:absolute;transform:translate(10px,-50%);white-space:nowrap;font-size:12.5px;line-height:1.35;
  background:var(--panel);border:1px solid var(--line);border-left:3px solid currentColor;padding:4px 8px;border-radius:6px;box-shadow:0 2px 8px rgba(20,30,45,.12)}
.lbl span{color:var(--ink)}
.lbl.left{transform:translate(calc(-100% - 10px),-50%)}
.lbl.plain{background:none;border:0;box-shadow:none;padding:0 2px;font-size:8.75px;color:var(--vink,var(--muted))!important}
.lbl.plain span{color:inherit}
.lbl.name{background:none;border:0;box-shadow:none;padding:0;font-size:14px;color:#111!important;transform:translate(-50%,-100%)!important;text-align:center}
.lbl.name span{color:#111}
.lbl strong{font-weight:600}
.viewbar{position:absolute;left:16px;bottom:16px;display:flex;gap:3px;flex-wrap:wrap}
.viewbar button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 11px;border-radius:8px;cursor:pointer}
.viewbar button[aria-pressed="true"]{border-color:var(--ink)}
.hint{position:absolute;right:16px;bottom:18px;color:var(--muted);font-size:12.5px}
.title3d{position:absolute;left:18px;top:14px;pointer-events:none;color:var(--vink,var(--ink))}
.title3d .n{font-family:'YdestreetB',"IBM Plex Sans KR",system-ui,sans-serif;font-size:32px;font-weight:700;letter-spacing:0}
.title3d .d{color:var(--vink,var(--muted));opacity:.8;font-size:14px;margin-top:2px}
@media (max-width:880px){
  .app{display:flex;flex-direction:column;height:auto}
  .topbar{order:0;grid-template-columns:1fr auto}
  .topbar > .seg{grid-column:1/-1;grid-row:2}
  .view{height:62vh;order:1}
  aside.dock{order:2}
  .dockgrid{grid-template-columns:1fr;max-height:none}
  .seg{flex:1}.seg button{flex:1;font-size:13px;padding:0 2px}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

function interp(m, d){
  const p = m.pts;
  if (d <= p[0].d) return {w:p[0].w,h:p[0].h};
  for (let i=0;i<p.length-1;i++){
    if (d <= p[i+1].d){
      const t=(d-p[i].d)/(p[i+1].d-p[i].d);
      return {w:p[i].w+(p[i+1].w-p[i].w)*t, h:p[i].h+(p[i+1].h-p[i].h)*t};
    }
  }
  const l=p[p.length-1]; return {w:l.w,h:l.h};
}

let cur = MODELS.find(x=>x.id==='250S') || MODELS[0], probeD = cur.pts[1].d;
const show = {labels:true, guide:true, grid:true, ruler:true, fit:false, compare:false, mode:'top', cmpStyle:'row'};

function rect(w,h,d,color,opacity){
  const g = new THREE.Group();

  g.add(new THREE.Mesh(pg, new THREE.MeshBasicMaterial({color, transparent:true, opacity, side:THREE.DoubleSide, depthWrite:false})));

  g.scale.set(w,1,h); g.position.y = -d;
  return g;
}
const corners = (p) => [[-p.w/2,-p.d,-p.h/2],[p.w/2,-p.d,-p.h/2],[p.w/2,-p.d,p.h/2],[-p.w/2,-p.d,p.h/2]];

/* ---------- CoPick3D 250C: simplified from product photos ----------
   top view = arched bar; lens face (concave) points down, lenses at both ends tilt inward;
   ribbed end faces; heatsink module + status LEDs on the arched top face */
/* ---------- CoPick3D 150S: simplified from product photo ----------
   compact box, two square windows on the lens face (down), white label strip,
   fine horizontal ribs wrapping the sides */
/* ---------- CoPick3D 250S / 350S / 610S: simplified from product photos ----------
   long straight bar, round lens at each end of the lens face (down), framed end panels,
   recessed grille on the end faces, heatsink module on the top face (+z), two connectors on the back */
function makeBodyBar(W){
  const g = new THREE.Group();
  const H=130, D=70;
  const body = new THREE.MeshStandardMaterial({color:0x30343d, roughness:.5, metalness:.35});
  const dark = new THREE.MeshStandardMaterial({color:0x17191d, roughness:.6, metalness:.3});
  const rib  = new THREE.MeshStandardMaterial({color:0x23262c, roughness:.7, metalness:.3});
  const glass = new THREE.MeshStandardMaterial({color:0x4d6f94, emissive:0x1d3b5c, emissiveIntensity:.5, roughness:.1, metalness:.2});
  const box = new THREE.Mesh(roundedBoxGeo(W,H,D,6), body); box.position.y=H/2; g.add(box);
  // lens face: seams framing the two end panels, round lens in each
  const lx = W/2-42;
  [-1,1].forEach(sg=>{
    const seam = new THREE.Mesh(new THREE.BoxGeometry(1.4,1,D-10), dark); seam.position.set(sg*(W/2-80),-.3,0); g.add(seam);
    const ring = new THREE.Mesh(new THREE.CylinderGeometry(21,21,5,40), dark); ring.position.set(sg*lx,-1.5,0); g.add(ring);
    const bez = new THREE.Mesh(new THREE.TorusGeometry(17,1.8,8,40), body); bez.rotation.x=Math.PI/2; bez.position.set(sg*lx,-4,0); g.add(bez);
    const gl = new THREE.Mesh(new THREE.CylinderGeometry(12,12,2,32), glass); gl.position.set(sg*lx,-3.6,0); g.add(gl);
    [-1,1].forEach(sz=>{ const sc=new THREE.Mesh(new THREE.CylinderGeometry(2,2,1,12), rib); sc.position.set(sg*lx+sz*24,-.4,26); g.add(sc); });
    // end face: recessed grille inside a rim
    const cap = new THREE.Mesh(new THREE.BoxGeometry(2,H-14,D-14), dark); cap.position.set(sg*(W/2+.2),H/2,0); g.add(cap);
    for (let z=-24; z<=24; z+=4){ const r=new THREE.Mesh(new THREE.BoxGeometry(2.6,H-24,1.8), rib); r.position.set(sg*(W/2+.6),H/2,z); g.add(r); }
  });
  // heatsink module on the top face (+z)
  const hy = H-58;
  const base = new THREE.Mesh(new THREE.BoxGeometry(92,96,3), dark); base.position.set(0,hy,D/2+1); g.add(base);
  for (let x=-40; x<=40; x+=4.5){ const f=new THREE.Mesh(new THREE.BoxGeometry(1.8,80,9), dark); f.position.set(x,hy,D/2+6.5); g.add(f); }
  // two connectors on the back face (bring the depth to 145)
  const gold = new THREE.MeshStandardMaterial({color:0xb8a46a, roughness:.3, metalness:.9});
  [-22,20].forEach(x=>{ const c=new THREE.Mesh(new THREE.CylinderGeometry(6,6,15,20), gold); c.position.set(x,H+7.5,14); g.add(c); });
  return g;
}

function makeBody150S(){
  const g = new THREE.Group();
  const W=180, H=127, D=70;
  const body = new THREE.MeshStandardMaterial({color:0x33363b, roughness:.55, metalness:.35});

  });
  // lens face (bottom): recessed panel, two square windows, label strip

function makeBody250C(){
  const g = new THREE.Group();
  const W=385, D=95, sagIn=25, backC=170, sagOut=18, bv=5;
  const body = new THREE.MeshStandardMaterial({color:0x363a40, roughness:.5, metalness:.35});
  const dark = new THREE.MeshStandardMaterial({color:0x17191c, roughness:.6, metalness:.3});
  // arc helpers (circle through ends and center)
  const arc = (half, yEnd, yMid) => { const s=yMid-yEnd, R=(half*half+s*s)/(2*s), cy=yMid-R;
    return {R, cy, y:x=>cy+Math.sqrt(R*R-x*x)}; };
  const inner = arc(W/2-bv, 0+bv, sagIn+bv), outer = arc(W/2-bv, backC-sagOut-bv, backC-bv);
  const sh = new THREE.Shape(), N=28, hx=W/2-bv;
  for (let k=0;k<=N;k++){ const x=-hx+2*hx*k/N; k? sh.lineTo(x,inner.y(x)) : sh.moveTo(x,inner.y(x)); }
  for (let k=0;k<=N;k++){ const x=hx-2*hx*k/N; sh.lineTo(x,outer.y(x)); }
  sh.closePath();
  const geo = new THREE.ExtrudeGeometry(sh,{depth:D-2*bv, bevelEnabled:true, bevelSize:bv, bevelThickness:bv, bevelSegments:3, curveSegments:4});
  geo.translate(0,0,-(D-2*bv)/2);
  g.add(new THREE.Mesh(geo, body));
  // lenses on the concave face, normal pointing to the arc centre (down + inward)
  const lensArc = arc(W/2, 0, sagIn);
  const glass = new THREE.MeshStandardMaterial({color:0x4d6f94, emissive:0x1d3b5c, emissiveIntensity:.5, roughness:.1, metalness:.2});
  [-1,1].forEach(sg=>{
    const x = sg*(W/2-50), phi = Math.asin(Math.abs(x)/lensArc.R);
    const n = new THREE.Vector3(-sg*Math.sin(phi), -Math.cos(phi), 0);
    const p = new THREE.Vector3(x, lensArc.y(x), 0);
    const lens = new THREE.Group(); lens.position.copy(p); lens.rotation.z = -sg*phi;
    const ring = new THREE.Mesh(new THREE.CylinderGeometry(31,31,8,40), dark); ring.position.y=-3; lens.add(ring);
    const bez = new THREE.Mesh(new THREE.TorusGeometry(26,2.2,8,40), body); bez.rotation.x=Math.PI/2; bez.position.y=-7.5; lens.add(bez);
    const gl = new THREE.Mesh(new THREE.CylinderGeometry(17,17,3,32), glass); gl.position.y=-7; lens.add(gl);
    g.add(lens);
  });
  // ribbed end faces
  const ribMat = new THREE.MeshStandardMaterial({color:0x222529, roughness:.7, metalness:.3});
  [-1,1].forEach(sg=>{
    for (let z=-36; z<=36; z+=6){
      const r = new THREE.Mesh(new THREE.BoxGeometry(4,108,2.6), ribMat);
      r.position.set(sg*(W/2+1), 78, z); g.add(r);
    }
  });
  // heatsink module + status LEDs on the arched top face (+z), connector on the back face
  const midY = (sagIn+backC)/2 + 4;
  const base = new THREE.Mesh(new THREE.BoxGeometry(132,104,4), dark); base.position.set(0,midY,D/2+1); g.add(base);
  for (let y=midY-40; y<=midY+36; y+=5){
    const f = new THREE.Mesh(new THREE.BoxGeometry(104,2,10), dark); f.position.set(0,y,D/2+7); g.add(f);
  }
  const ledMat = new THREE.MeshStandardMaterial({color:0x2bdc6b, emissive:0x2bdc6b, emissiveIntensity:1});
  for (let k=0;k<4;k++){ const l=new THREE.Mesh(new THREE.BoxGeometry(4,3,2), ledMat); l.position.set(-12+k*8, midY+46, D/2+3.5); g.add(l); }
  const conn = new THREE.Mesh(new THREE.CylinderGeometry(7,7,10,20), new THREE.MeshStandardMaterial({color:0xb8a46a, roughness:.3, metalness:.9}));
  conn.position.set(0, backC+2, 12); g.add(conn);
  return g;
}

function makeBody(m){
  const [W,H,Hm,D] = m.size;
  if (m.body==='250C') return makeBody250C();
  if (m.body==='150S') return makeBody150S();
  if (m.body==='bar')  return makeBodyBar(W);
  const g = new THREE.Group();
  const b = new THREE.Mesh(new THREE.BoxGeometry(W,H,D), new THREE.MeshStandardMaterial({color:css('--body'), roughness:.55, metalness:.3}));
  b.position.y = H/2; g.add(b); return g;
}

// side-by-side compare: model centres along the camera width axis, relative to the selected model
function rowLayout(){
  const GAP = 220, ws = MODELS.map(o=>Math.max(o.size[0], o.pts[o.pts.length-1].w));
  const cs = []; ws.forEach((w,i)=>cs.push(i ? cs[i-1] + ws[i-1]/2 + GAP + w/2 : 0));
  const si = MODELS.indexOf(cur), off = cs.map(c=>c-cs[si]);
  const left = off[0]-ws[0]/2, right = off[off.length-1]+ws[ws.length-1]/2;
  return {off, left, right, center:(left+right)/2, span:right-left};
}
const isRow = () => show.compare && show.cmpStyle==='row';

function build(){
  while(root.children.length) root.remove(root.children[0]);
  while(world.children.length) world.remove(world.children[0]);
  applyMode();
  labelsEl.innerHTML=''; labelItems=[];
  const m = cur, [W,H,Hm,D] = m.size, P = m.pts;
  const col = {Near:css('--near'), Focus:css('--focus'), Far:css('--far')};
  applyBg();

  // camera body (lens faces down, bottom face at y=0)
  root.add(makeBody(m));

  // working volume between measured planes
  const pos=[], edges=[];
  for (let i=0;i<P.length-1;i++){
    const a=corners(P[i]), b=corners(P[i+1]);
    for (let j=0;j<4;j++){
      const k=(j+1)%4;
      pos.push(...a[j],...a[k],...b[k], ...a[j],...b[k],...b[j]);
      edges.push(...a[j],...b[j]);
    }
  }
  const vg = new THREE.BufferGeometry(); vg.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  const volCol = show.compare ? mcol(cur.id) : col.Far;
  root.add(new THREE.Mesh(vg, new THREE.MeshBasicMaterial({color:volCol, transparent:true, opacity:show.compare?.18:.08, side:THREE.DoubleSide, depthWrite:false})));
  const eg = new THREE.BufferGeometry(); eg.setAttribute('position', new THREE.Float32BufferAttribute(edges,3));
  root.add(new THREE.LineSegments(eg, new THREE.LineBasicMaterial({color:volCol, transparent:true, opacity:show.compare?.4:.22})));

  // guide lines from lens origin to near plane
  const gp=[]; corners(P[0]).forEach(c=>gp.push(0,0,0,...c));
  const gg = new THREE.BufferGeometry(); gg.setAttribute('position', new THREE.Float32BufferAttribute(gp,3));
  guideObj = new THREE.LineSegments(gg, new THREE.LineDashedMaterial({color:css('--muted'), dashSize:14, gapSize:10, transparent:true, opacity:.4}));
  guideObj.computeLineDistances(); guideObj.visible = show.guide; root.add(guideObj); guideObjs = [guideObj];

  // measured planes
  P.forEach(p=>{
    root.add(rect(p.w,p.h,p.d,col[p.k],.16));
    addLabel(new THREE.Vector3(p.w/2,-p.d,0), col[p.k],
      `<strong>${p.k}</strong> <span class="num">${fmt(p.d)} mm</span><br><span class="num">${fmt(p.w)} × ${fmt(p.h)}</span>`);
  });

  // compare: overlay (all FoVs share one origin) or row (each camera + FoV side by side)
  compareMeshes = [];
  const lay = isRow() ? rowLayout() : null;
  const sgn = (lay && show.mode==='side') ? -1 : 1;   // hand-eye: keep the row reading left → right
  if (show.compare){
    MODELS.forEach((o,idx)=>{
      if (o===cur) return;
      const c = mcol(o.id), Q=o.pts, pp=[], ee=[];
      for (let i=0;i<Q.length-1;i++){
        const a=corners(Q[i]), b=corners(Q[i+1]);
        for (let j=0;j<4;j++){ const k=(j+1)%4;
          pp.push(...a[j],...a[k],...b[k], ...a[j],...b[k],...b[j]); ee.push(...a[j],...b[j]); }
      }
      Q.forEach(q=>{ const cc=corners(q); for (let j=0;j<4;j++) ee.push(...cc[j],...cc[(j+1)%4]); });
      const grp = new THREE.Group(); if (lay) grp.position.x = sgn*lay.off[idx]; root.add(grp);
      const g1 = new THREE.BufferGeometry(); g1.setAttribute('position', new THREE.Float32BufferAttribute(pp,3));
      const mesh = new THREE.Mesh(g1, new THREE.MeshBasicMaterial({color:c, transparent:true, opacity:lay?.07:.025, side:THREE.DoubleSide, depthWrite:false}));
      mesh.userData.id = o.id; grp.add(mesh); compareMeshes.push(mesh);
      const g2 = new THREE.BufferGeometry(); g2.setAttribute('position', new THREE.Float32BufferAttribute(ee,3));
      grp.add(new THREE.LineSegments(g2, new THREE.LineBasicMaterial({color:c, transparent:true, opacity:lay?.4:.28})));
      // guide lines for every model, toggled together with the selected one
      const gq=[]; corners(Q[0]).forEach(cc=>gq.push(0,0,0,...cc));
      const gl = new THREE.LineSegments(new THREE.BufferGeometry().setAttribute('position', new THREE.Float32BufferAttribute(gq,3)),
        new THREE.LineDashedMaterial({color:css('--muted'), dashSize:14, gapSize:10, transparent:true, opacity:.4}));
      gl.computeLineDistances(); gl.visible = show.guide; grp.add(gl); guideObjs.push(gl);
      if (lay){
        const body = makeBody(o); grp.add(body);
        body.traverse(x=>{ if (x.isMesh) x.userData.id = o.id; }); body.traverse(x=>{ if (x.isMesh) compareMeshes.push(x); });
        { const it = addLabel(new THREE.Vector3(sgn*lay.off[idx], o.size[1]+60, 0), c, `<strong>${o.id}</strong>`, true); it.row = true; it.el.classList.add('name'); }
      }
    });
    if (lay){ const it = addLabel(new THREE.Vector3(0, cur.size[1]+60, 0), mcol(cur.id), `<strong>${cur.id}</strong>`, true); it.row = true; it.el.classList.add('name'); }
  }

  // probe plane + target object
  probeGroup = rect(1,1,0,css('--probe'),.22); root.add(probeGroup);
  objGroup = makeObject(objType); world.add(objGroup);
  probeGroup.userData.label = addLabel(new THREE.Vector3(), css('--probe'), '', true);

  // floor grid at this model's Far distance (same absolute size and 100 mm cells for every model)
  let gs = show.mode==='side' ? Math.max(1600, Math.ceil((P[P.length-1].d+400)/100)*100) : 1600;
  if (lay) gs = Math.max(gs, Math.ceil((lay.span+600)/100)*100);
  gridObj = new THREE.GridHelper(gs, gs/100, css('--grid'), css('--grid'));
  gridObj.userData.size = gs; gridObj.userData.cx = lay ? sgn*lay.center : 0; gridObj.visible = show.grid; world.add(gridObj);

  // vertical distance ruler, fixed position for every model
  const rx = lay ? sgn*(lay.left-180) : -560, rp = [rx,0,0, rx,-WORLD_D,0];
  for (let d=0; d<=WORLD_D; d+=100){ const t = d%500===0 ? 40 : 18; rp.push(rx,-d,0, rx+t,-d,0); }
  const rg = new THREE.BufferGeometry(); rg.setAttribute('position', new THREE.Float32BufferAttribute(rp,3));
  rulerObj = new THREE.LineSegments(rg, new THREE.LineBasicMaterial({color:css('--muted')}));
  rulerObj.visible = show.ruler; root.add(rulerObj);
  rulerLabels = [];
  for (let d=0; d<=WORLD_D; d+=500){
    const it = addLabel(new THREE.Vector3(rx,-d,0), css('--muted'), `<span class="num">${fmt(d)} mm</span>`, true);
    it.ruler = true; it.el.classList.add('plain'); rulerLabels.push(it);
  }
  updateProbe();
}

const SIDE_Q = new THREE.Quaternion().setFromRotationMatrix(
  new THREE.Matrix4().makeBasis(new THREE.Vector3(0,0,-1), new THREE.Vector3(-1,0,0), new THREE.Vector3(0,1,0)));
function applyMode(){ // hand-eye: camera looks along +x, top face up, width along z
  if (show.mode==='side') root.quaternion.copy(SIDE_Q); else root.quaternion.identity();
  root.updateMatrixWorld(true);
}
function frameView(){
  if (isRow()){
    const L = rowLayout(), k = 2*Math.tan(cam.fov*Math.PI/360)*cam.aspect;
    // fit the whole row (plus ruler) into the area left of the compare chart
    const r = Math.max(WORLD_D*1.9, (L.span+700)/(.52*k));
    const shift = .12 * k * r - 180;
    if (show.mode==='side') orbit.target.set((WORLD_D-150)/2, 0, L.center + shift); else orbit.target.set(L.center + shift, (150-WORLD_D)/2, 0);
    orbit.r = r; return;
  }
  if (show.mode==='side'){
    orbit.target.set((WORLD_D-150)/2, 0, 0); orbit.r = WORLD_D * 2.25;
  } else if (show.fit){
    const far = cur.pts[cur.pts.length-1];
    orbit.target.set(0, (cur.size[1] - far.d)/2, 0);
    orbit.r = Math.max(far.d, far.w) * 2.3;
  } else {
    orbit.target.set(0, (150 - WORLD_D)/2, 0);
    orbit.r = WORLD_D * 2.25;
  }
}

/* ---------- target objects (real-world size, mm; local origin = top-center) ---------- */
const OBJECTS = {
  none:{name:'없음'},
  bolt:{name:'육각 볼트 M10 × 50', L:56.4, W:19.6, H:19.6, info:'M10 × 50 육각 볼트를 눕혀 놓은 상태 · 56 × 20 × 20 mm'},
  can:{name:'음료 캔 355 ml', L:66, W:66, H:122, info:'355 ml 음료 캔을 세워 놓은 상태 · Ø66 × 122 mm'},
  nuts:{name:'너트 박스', L:300, W:200, H:75, info:'M10 너트가 쌓인 낮은 트레이 · 300 × 200 × 60 mm, 더미 꼭대기는 테두리 위 15 mm, 너트 약 650개'},
  cube:{name:'육면체', L:200, W:150, H:100, R:8},
  sphere:{name:'구', L:120, W:120, H:120},
};
let objType = 'can', objGroup = null, customShape = 'cube';

// rounded box: vertices packed into the edge band, then pushed onto radius-R arcs
function roundedBoxGeo(L,H,W,R){
  R = Math.max(0, Math.min(R, L/2, H/2, W/2));
  const k = 6, S = 2*k+1, g = new THREE.BoxGeometry(2,2,2,S,S,S);
  const pos = g.attributes.position, nor = g.attributes.normal, half=[L/2,H/2,W/2];
  const p = new THREE.Vector3(), q = new THREE.Vector3(), d = new THREE.Vector3();
  const map = (u,h)=>{ const i=Math.round((u+1)*S/2);
    if (R===0) return u*h;
    return i<=k ? -h + R*(i/k) : h - R*((S-i)/k); };
  for (let v=0; v<pos.count; v++){
    p.set(map(pos.getX(v),half[0]), map(pos.getY(v),half[1]), map(pos.getZ(v),half[2]));
    q.set(Math.max(-half[0]+R,Math.min(half[0]-R,p.x)), Math.max(-half[1]+R,Math.min(half[1]-R,p.y)), Math.max(-half[2]+R,Math.min(half[2]-R,p.z)));
    d.subVectors(p,q);
    if (R>0 && d.lengthSq()>1e-9){ d.normalize(); p.copy(q).addScaledVector(d,R); nor.setXYZ(v,d.x,d.y,d.z); }
    pos.setXYZ(v,p.x,p.y,p.z);
  }
  pos.needsUpdate = nor.needsUpdate = true;
  return g;
}
function readDims(){
  const num = (id,def)=>{ const v=parseFloat($(id).value); return isFinite(v)&&v>0 ? v : def; };
  const c = OBJECTS.cube;
  c.L=num('dL',200); c.W=num('dW',150); c.H=num('dH',100);
  const r=parseFloat($('dR').value); c.R = isFinite(r)&&r>=0 ? Math.min(r, c.L/2, c.W/2, c.H/2) : 0;
  const D=num('dD',120); Object.assign(OBJECTS.sphere,{L:D,W:D,H:D});
  c.info = `가로 ${fmt(c.L)} × 세로 ${fmt(c.W)} × 높이 ${fmt(c.H)} mm · 모서리 R${+c.R.toFixed(1)}`;
  OBJECTS.sphere.info = `지름 ${fmt(D)} mm 구 · 윗면 = 구의 가장 높은 점`;
}
const steel = () => new THREE.MeshStandardMaterial({color:0xa9b1ba, roughness:.35, metalness:.85});

function hexNutGeo(){
  const s = new THREE.Shape(), R = 9.8;
  for (let i=0;i<6;i++){ const a=Math.PI/6+i*Math.PI/3; i? s.lineTo(R*Math.cos(a),R*Math.sin(a)) : s.moveTo(R*Math.cos(a),R*Math.sin(a)); }
  const h = new THREE.Path(); h.absarc(0,0,4.3,0,Math.PI*2,true); s.holes.push(h);
  const g = new THREE.ExtrudeGeometry(s,{depth:8, bevelEnabled:false, curveSegments:12});
  g.translate(0,0,-4); return g;
}
function makeObject(type){
  const g = new THREE.Group();
  if (type==='cube'){
    const o=OBJECTS.cube;
    const m = new THREE.Mesh(roundedBoxGeo(o.L,o.H,o.W,o.R), new THREE.MeshStandardMaterial({color:0xc9a978, roughness:.75, metalness:0}));
    m.position.y = -o.H/2; g.add(m);
  } else if (type==='sphere'){
    const D=OBJECTS.sphere.H;
    const m = new THREE.Mesh(new THREE.SphereGeometry(D/2,48,32), new THREE.MeshStandardMaterial({color:0xb4bec9, roughness:.4, metalness:.3}));
    m.position.y = -D/2; g.add(m);
  } else if (type==='bolt'){
    const head = new THREE.Mesh(new THREE.CylinderGeometry(9.8,9.8,6.4,6), steel());
    head.rotation.z = Math.PI/2; head.position.set(-25,-9.8,0); g.add(head);
    const shank = new THREE.Mesh(new THREE.CylinderGeometry(5,5,50,24), steel());
    shank.rotation.z = Math.PI/2; shank.position.set(3.2,-9.8,0); g.add(shank);
    for (let x=-12;x<=27;x+=1.5){ // thread rings
      const r = new THREE.Mesh(new THREE.TorusGeometry(5,.45,6,20), steel());
      r.rotation.y = Math.PI/2; r.position.set(x,-9.8,0); g.add(r);
    }
  } else if (type==='can'){
    const red = new THREE.MeshStandardMaterial({color:0xc8102e, roughness:.35, metalness:.4});
    const alu = new THREE.MeshStandardMaterial({color:0xc9ced4, roughness:.3, metalness:.9});
    const body = new THREE.Mesh(new THREE.CylinderGeometry(33,33,108,40), red); body.position.y=-61; g.add(body);
    const top = new THREE.Mesh(new THREE.CylinderGeometry(27,33,7,40), alu); top.position.y=-3.5; g.add(top);
    const bot = new THREE.Mesh(new THREE.CylinderGeometry(33,26,7,40), alu); bot.position.y=-118.5; g.add(bot);
    const tab = new THREE.Mesh(new THREE.BoxGeometry(18,1.2,10), alu); tab.position.set(8,0,0); g.add(tab);
  } else if (type==='nuts'){
    const L=300,W=200,H=60,t=4,P=15; // box height, wall, heap peak above rim
    const box = new THREE.Group(); box.position.y = -P; g.add(box);
    const plastic = new THREE.MeshStandardMaterial({color:0x2f6fb3, roughness:.7, metalness:0});
    const add = (w,h,d,x,y,z)=>{ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),plastic); m.position.set(x,y,z); box.add(m); };
    add(L,t,W,0,-H+t/2,0);
    add(L,H,t,0,-H/2,W/2-t/2); add(L,H,t,0,-H/2,-W/2+t/2);
    add(t,H,W,L/2-t/2,-H/2,0); add(t,H,W,-L/2+t/2,-H/2,0);
    // heap of M10 nuts: higher in the middle, settles below the rim
    const N = 650, geo = hexNutGeo(), inst = new THREE.InstancedMesh(geo, steel(), N);
    const M = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), v = new THREE.Vector3(), one = new THREE.Vector3(1,1,1);
    let seed = 7; const rnd = ()=> (seed = (seed*16807)%2147483647)/2147483647;
    for (let i=0;i<N;i++){
      const x=(rnd()-.5)*(L-2*t-20), z=(rnd()-.5)*(W-2*t-20);
      const rr = (x/(L/2))**2 + (z/(W/2))**2;
      const surf = -H + t + 12 + (H - t - 12 + P)*Math.max(0,1-rr); // heap surface, peaks above rim
      const y = Math.max(-H + t + 5, surf - rnd()*rnd()*30);         // bias toward surface
      e.set(rnd()*Math.PI, rnd()*Math.PI, rnd()*Math.PI); q.setFromEuler(e);
      M.compose(v.set(x,y,z), q, one); inst.setMatrixAt(i,M);
    }
    box.add(inst);
  }
  return g;
}

function updateProbe(){
  const f = interp(cur, probeD);
  if (probeGroup){
    probeGroup.scale.set(f.w,1,f.h); probeGroup.position.y = -probeD;
    const L = probeGroup.userData.label;
    L.vec.set(-f.w/2, -probeD, 0);
    L.el.innerHTML = `<span class="num">${fmt(probeD)} mm</span><br><span class="num">${fmt(f.w)} × ${fmt(f.h)}</span>`;
  }
  $('pd').textContent = fmt(probeD);
  $('pf').textContent = `${fmt(f.w)} × ${fmt(f.h)}`;
  const side = show.mode==='side', o = OBJECTS[objType], far = cur.pts[cur.pts.length-1];
  $('pmid').textContent = side ? '카메라 → 대상체 앞면 거리' : '카메라 → 대상체 윗면 거리';
  if (objGroup){
    if (side) objGroup.position.set(probeD + (o.L||0)/2, (o.H||0)/2, 0);   // standing on the floor, facing the camera
    else objGroup.position.set(0, -probeD, 0);
  }
  if (gridObj){
    const cx = gridObj.userData.cx||0, fd = isRow() ? WORLD_D : far.d;
    if (side) gridObj.position.set(gridObj.userData.size/2 - 300, -((o.H||240)/2) - 1, -cx);
    else gridObj.position.set(cx, -fd - 1, 0);
  }
  const st = $('status');
  if (objType==='none'){ st.innerHTML=''; return; }
  let fits, back, depthOk, cover, faceTxt;
  if (side){
    fits = o.W<=f.w && o.H<=f.h;
    back = probeD + o.L; cover = Math.min(100,(o.W*o.H)/(f.w*f.h)*100); faceTxt = `${fmt(o.W)} × ${fmt(o.H)} mm`;
  } else {
    fits = (o.L<=f.w && o.W<=f.h) || (o.L<=f.h && o.W<=f.w);
    back = probeD + o.H; cover = Math.min(100,(o.L*o.W)/(f.w*f.h)*100); faceTxt = `${fmt(o.L)} × ${fmt(o.W)} mm`;
  }
  depthOk = back <= far.d;
  const okTxt = side ? '깊이 전체가 작업 범위 안' : '높이 전체가 작업 범위 안';
  const ngTxt = side ? '뒷면이 Far보다 멂' : '바닥면이 Far보다 멂';
  st.innerHTML =
    `<div><span class="${fits?'ok':'ng'}">${fits?'FoV 안에 들어옴':'FoV를 벗어남'}</span><span>${faceTxt}, 화면의 약 ${cover.toFixed(cover<10?1:0)}%</span></div>`+
    `<div><span class="${depthOk?'ok':'ng'}">${depthOk?okTxt:ngTxt}</span><span>${side?'뒷면':'바닥면'} ${fmt(back)} mm (Far ${fmt(far.d)})</span></div>`;
}

/* ---------- orbit controls ---------- */
const ptrs = new Map(); let pinch0=0, r0=0, mid0=null;
const vR = new THREE.Vector3(), vU = new THREE.Vector3();
function pan(dx, dy){ // move the look-at target in screen space (right-drag / two-finger drag)
  const k = 2*orbit.r*Math.tan(cam.fov*Math.PI/360)/Math.max(1,view.clientHeight);
  vR.setFromMatrixColumn(cam.matrix,0); vU.setFromMatrixColumn(cam.matrix,1);
  orbit.target.addScaledVector(vR, -dx*k).addScaledVector(vU, dy*k);
  anim = null;
}
canvas.addEventListener('contextmenu', e=>e.preventDefault());
canvas.addEventListener('pointerdown', e=>{ canvas.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY, pan: e.button===2 || e.button===1 || e.shiftKey});
  if (ptrs.size===2){ const [a,b]=[...ptrs.values()]; pinch0=Math.hypot(a.x-b.x,a.y-b.y); r0=orbit.r; mid0={x:(a.x+b.x)/2,y:(a.y+b.y)/2}; } });
canvas.addEventListener('pointermove', e=>{
  if (!ptrs.has(e.pointerId)) return;
  const prev = ptrs.get(e.pointerId); const cur2={x:e.clientX,y:e.clientY,pan:prev.pan}; ptrs.set(e.pointerId,cur2);
  if (ptrs.size===1){
    if (prev.pan){ pan(cur2.x-prev.x, cur2.y-prev.y); return; }
    orbit.theta -= (cur2.x-prev.x)*.008;
    orbit.phi = Math.min(Math.PI-.05, Math.max(.05, orbit.phi - (cur2.y-prev.y)*.008));
    setPreset(null);
  } else if (ptrs.size===2){
    const [a,b]=[...ptrs.values()]; const dd=Math.hypot(a.x-b.x,a.y-b.y);
    if (pinch0) orbit.r = r0 * pinch0/dd;
    const mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
    if (mid0){ pan(mid.x-mid0.x, mid.y-mid0.y); } mid0=mid;
  }
});
['pointerup','pointercancel'].forEach(t=>canvas.addEventListener(t, e=>{ ptrs.delete(e.pointerId); pinch0=0; mid0=null; }));
canvas.addEventListener('wheel', e=>{ e.preventDefault(); orbit.r *= Math.exp(e.deltaY*.0012); }, {passive:false});

let anim=null;
function setPreset(k){
  document.querySelectorAll('#viewbar button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.v===k));
  if (!k) { anim=null; return; }
  const keepR = orbit.r; frameView(); orbit.r = keepR;   // re-centre after panning
  let [t,p]=PRESETS[k];
  if (k==="home" && isRow() && show.mode==="side") t = -1.3;   // row runs along z: look across it
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce){ orbit.theta=t; orbit.phi=p; return; }
  let dt = t - orbit.theta; dt = Math.atan2(Math.sin(dt), Math.cos(dt));
  anim = {t0:performance.now(), fromT:orbit.theta, fromP:orbit.phi, toT:orbit.theta+dt, toP:p};
}
$('viewbar').addEventListener('click', e=>{ const b=e.target.closest('button'); if (b) setPreset(b.dataset.v); });

/* ---------- render loop ---------- */
const tmp = new THREE.Vector3();
function frame(now){
  if (anim){
    const k = Math.min(1,(now-anim.t0)/550), e = 1-Math.pow(1-k,3);
    orbit.theta = anim.fromT+(anim.toT-anim.fromT)*e; orbit.phi = anim.fromP+(anim.toP-anim.fromP)*e;
    if (k===1) anim=null;
  }
  const {theta,phi,r,target}=orbit;
  cam.position.set(target.x+r*Math.sin(phi)*Math.sin(theta), target.y+r*Math.cos(phi), target.z+r*Math.sin(phi)*Math.cos(theta));
  cam.lookAt(target);
  if (renderer) renderer.render(scene, cam);
  const w=view.clientWidth, h=view.clientHeight;
  labelItems.forEach(({vec,el,ruler})=>{
    tmp.copy(vec).applyMatrix4(root.matrixWorld).project(cam);
    const vis = (ruler ? show.ruler : show.labels) && tmp.z<1;
    el.style.display = vis?'block':'none';
    if (vis){ el.style.left=((tmp.x+1)/2*w)+'px'; el.style.top=((1-tmp.y)/2*h)+'px'; }
  });
  requestAnimationFrame(frame);
}
function resize(){
  const w=view.clientWidth, h=view.clientHeight; if (!w||!h) return;
  if (renderer){ renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(w,h,false); }
  cam.aspect=w/h; cam.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(view);

let downAt=null; const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
canvas.addEventListener('pointerdown', e=>{ downAt = e.button===0 && !e.shiftKey ? {x:e.clientX,y:e.clientY} : null; });

  if (!downAt || !show.compare) return;
  const moved = Math.hypot(e.clientX-downAt.x, e.clientY-downAt.y); downAt=null;
  if (moved>5) return;
  const r = canvas.getBoundingClientRect();
  ndc.set((e.clientX-r.left)/r.width*2-1, -((e.clientY-r.top)/r.height*2-1));

function applyBg(){
  const c = show.bg || css('--view');
  scene.background = new THREE.Color(c);
  view.style.background = c;
  // keep overlay text readable on dark custom backgrounds
  const k = new THREE.Color(c); const lum = .2126*k.r + .7152*k.g + .0722*k.b;
  view.style.setProperty('--vink', show.bg ? (lum < .45 ? '#eef1f5' : '#1a2330') : '');
}
$('bgrow').addEventListener('click', e=>{ const b=e.target.closest('.sw'); if (!b) return;
  show.bg = b.dataset.bg; document.querySelectorAll('#bgrow .sw').forEach(x=>x.setAttribute('aria-pressed', x===b)); applyBg(); });
$('bgPick').addEventListener('input', e=>{ show.bg = e.target.value;
  document.querySelectorAll('#bgrow .sw').forEach(x=>x.setAttribute('aria-pressed','false')); applyBg(); });

/* ---------- PNG export of the 3D view (scene + labels + title + compare chart) ----------
   Drawn by hand onto a 2D canvas: no iframe/DOM cloning, so it also works inside the claude.ai viewer. */
function rr(ctx,x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
const clear = c => !c || c==='transparent' || /rgba\([^)]*,\s*0\)$/.test(c);
function paint(ctx, el, vr, a){
  if (el.hidden) return;
  const cs = getComputedStyle(el);
  if (cs.display==='none' || cs.visibility==='hidden') return;
  a *= parseFloat(cs.opacity); if (!(a>0)) return;
  const r = el.getBoundingClientRect(), x = r.left-vr.left, y = r.top-vr.top;
  if (r.width && r.height){
    const rad = parseFloat(cs.borderTopLeftRadius)||0;
    ctx.globalAlpha = a;
    if (!clear(cs.backgroundColor)){ ctx.fillStyle = cs.backgroundColor; rr(ctx,x,y,r.width,r.height,rad); ctx.fill(); }
    const bt = parseFloat(cs.borderTopWidth)||0, bl = parseFloat(cs.borderLeftWidth)||0;
    if (bt>0 && cs.borderTopStyle!=='none' && !clear(cs.borderTopColor)){ ctx.strokeStyle = cs.borderTopColor; ctx.lineWidth = bt; rr(ctx,x+bt/2,y+bt/2,r.width-bt,r.height-bt,rad); ctx.stroke(); }
    if (bl>bt && cs.borderLeftStyle!=='none' && !clear(cs.borderLeftColor)){
      ctx.save(); rr(ctx,x,y,r.width,r.height,rad); ctx.clip(); ctx.fillStyle = cs.borderLeftColor; ctx.fillRect(x,y,bl,r.height); ctx.restore();
    }
  }
  if (el.tagName==='INPUT' && el.type==='checkbox' && r.width){   // native checkbox → simple drawn box
    ctx.globalAlpha = a; rr(ctx,x+.5,y+.5,r.width-1,r.height-1,3);
    if (el.checked){ ctx.fillStyle = css('--far'); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x+r.width*.25,y+r.height*.52); ctx.lineTo(x+r.width*.43,y+r.height*.7); ctx.lineTo(x+r.width*.76,y+r.height*.32); ctx.stroke(); }
    else { ctx.strokeStyle = css('--muted'); ctx.lineWidth = 1; ctx.stroke(); }
  }
  for (const n of el.childNodes){
    if (n.nodeType===1){ paint(ctx, n, vr, a); continue; }
    if (n.nodeType!==3 || !n.textContent.trim()) continue;
    const range = document.createRange(); range.selectNodeContents(n);
    const rc = range.getClientRects()[0]; if (!rc) continue;
    ctx.globalAlpha = a; ctx.fillStyle = cs.color; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    ctx.font = `${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
    if ('letterSpacing' in ctx) ctx.letterSpacing = cs.letterSpacing==='normal' ? '0px' : cs.letterSpacing;
    ctx.fillText(n.textContent.replace(/\s+/g,' '), rc.left-vr.left, rc.top-vr.top+rc.height/2);
  }
  ctx.globalAlpha = 1;
}
async function exportPNG(transparent){
  // export at 3× the on-screen resolution (capped by the GPU's max render size)
  const pr0 = renderer.getPixelRatio(), vr = view.getBoundingClientRect();
  const gl = renderer.getContext(), maxPx = Math.min(gl.getParameter(gl.MAX_RENDERBUFFER_SIZE), gl.getParameter(gl.MAX_VIEWPORT_DIMS)[0], 12000);
  const pr = Math.min(pr0*3, maxPx/Math.max(vr.width, vr.height));
  const out = document.createElement('canvas');
  out.width = Math.round(vr.width*pr); out.height = Math.round(vr.height*pr);
  const ctx = out.getContext('2d');
  const bg = scene.background;
  if (transparent){ scene.background = null; renderer.setClearColor(0x000000, 0); }
  renderer.setPixelRatio(pr); renderer.setSize(vr.width, vr.height, false);
  renderer.render(scene, cam);
  ctx.drawImage(canvas, 0, 0, out.width, out.height);
  scene.background = bg;
  renderer.setPixelRatio(pr0); renderer.setSize(vr.width, vr.height, false);
  renderer.render(scene, cam);
  ctx.scale(pr, pr);
  [labelsEl, document.querySelector('.title3d'), $('cmpChart')].forEach(el=>paint(ctx, el, vr, 1));
  const blob = await new Promise(r=>out.toBlob(r,'image/png'));
  const d = new Date(), pad = n=>String(n).padStart(2,'0');
  const name = `CoPick3D_${cur.id}_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${transparent?'_transparent':''}.png`;
  let dl = null;
  try { if (window.claude && typeof claude.use==='function') dl = await claude.use('downloads'); } catch(e){}
  if (dl){ await dl.save({filename:name, data:blob}); return 'saved'; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  return 'saved';
}
async function runExport(transparent){
  const btn = $('pngBtn'); if (!renderer || btn.disabled) return;
  $('pngMenu').hidden = true; $('pngMore').setAttribute('aria-expanded', false);
  btn.disabled = true; btn.textContent = '저장 중…';
  let msg = null;
  try { await exportPNG(transparent); }
  catch(e){
    const code = e && e.code;
    msg = code==='declined' ? null : code==='rate_limited' ? '잠시 후 다시' : '저장 실패';
    if (!code) console.error(e);
  }
  btn.textContent = msg || 'PNG 저장';
  setTimeout(()=>{ btn.textContent = 'PNG 저장'; btn.disabled = false; }, msg ? 1800 : 0);
}
$('pngBtn').addEventListener('click', ()=>runExport(false));
$('pngAlphaBtn').addEventListener('click', ()=>runExport(true));

$('dispBtn').addEventListener('click', e=>{ e.stopPropagation();
  const open = $('dispPop').hidden; $('dispPop').hidden = !open; $('dispBtn').setAttribute('aria-expanded', open); });
$('pngMore').addEventListener('click', e=>{ e.stopPropagation();
  const open = $('pngMenu').hidden; $('pngMenu').hidden = !open; $('pngMore').setAttribute('aria-expanded', open); });
document.addEventListener('click', e=>{
  if (!$('dispPop').hidden && !e.target.closest('.dispwrap')){ $('dispPop').hidden = true; $('dispBtn').setAttribute('aria-expanded', false); }
  if (!$('pngMenu').hidden && !e.target.closest('.pngsplit')){ $('pngMenu').hidden = true; $('pngMore').setAttribute('aria-expanded', false); }
});
document.addEventListener('keydown', e=>{ if (e.key==='Escape'){ $('dispPop').hidden = true; $('dispBtn').setAttribute('aria-expanded', false); $('pngMenu').hidden = true; $('pngMore').setAttribute('aria-expanded', false); } });
$('dockToggle').addEventListener('click', ()=>{
  const open = $('dockToggle').getAttribute('aria-expanded')!=='true';
  $('dockToggle').setAttribute('aria-expanded', open);
  $('dockBody').classList.toggle('collapsed', !open);
});

renderPanel(); renderObjInfo(); build(); frameView(); resize(); requestAnimationFrame(frame);
