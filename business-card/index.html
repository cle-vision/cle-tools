<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CLE Robotics - 디지털 명함 생성 및 이미지 추출기</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React 18 & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>

  <!-- html2canvas for Image Export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <!-- Google Fonts & Pretendard -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&family=Montserrat:wght@400;600;700;800&family=Inter:wght@500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: 'Noto Sans KR', sans-serif; }
    .font-montserrat { font-family: 'Montserrat', sans-serif; }

    /* Standard Business Card Dimension (500px x 300px scale container) */
    .card-dimension {
      width: 500px;
      height: 300px;
      max-width: 100%;
    }

    /* Target scale card matching exact proportion */
    .card-inner-exact {
      width: 255px;
      height: 153px;
      position: relative;
      background: white;
      overflow: hidden;
      transform: scale(1.96);
      transform-origin: 0 0;
    }
  </style>
</head>
<body class="bg-[#F8F9FB] text-slate-800">
  <div id="root"></div>

  <script type="text/babel" data-presets="react,env">
    const { useState, useEffect, useRef } = React;

    /*
      ────────────────────────────────────────────────────────────────
      직원 명단 데이터 소스
      ────────────────────────────────────────────────────────────────
      실제 60명 규모 명단은 GitHub 저장소(cle-vision/cle-tools)의
      "employees.json" 파일에서 fetch 해옵니다 (로고 이미지와 동일한 저장소/브랜치 가정).
      해당 파일이 없거나 fetch 에 실패하면 아래 DEFAULT_EMPLOYEES(데모 2인)로 동작합니다.

      employees.json 스키마 (배열, 각 원소는 아래 형태의 평면 객체):
      {
        "name": "지현경",          // 성명 (인증용)
        "birth": "0520",           // 생년월일 4자리 MMDD (인증용)
        "nameKo": "지 현 경",
        "nameEn": "JEE, HYUNKYUNG",
        "deptKo": "성장전략 | 인사",
        "deptEn": "Growth Strategy | HR",
        "titleKo": "책임매니저",
        "titleEn": "Senior Manager",
        "mobile": "10.5019.3659", // 010-XXXX-XXXX 중 10.XXXX.XXXX 형태
        "email": "hkjee",          // @clerobotics.com 앞부분만
        "location": "hq"           // "hq" 또는 "lab"
      }
    */
    const EMPLOYEES_URL = "https://raw.githubusercontent.com/cle-vision/cle-tools/main/business-card/employees.json";

    const DEFAULT_EMPLOYEES = [
      {
        name: "지현경",
        birth: "0302",
        nameKo: "지 현 경",
        nameEn: "JEE, HYUNKYUNG",
        deptKo: "성장전략 | 인사",
        deptEn: "Growth Strategy | HR",
        titleKo: "책임매니저 | 리드",
        titleEn: "Senior Manager | Lead",
        mobile: "10.5019.3659",
        email: "hkjee",
        location: "hq"
      }
    ];

    // 본사 / 시스템연구소 대표번호·팩스 (전화/팩스는 근무지 공통 정보)
    const LOCATION_PHONE = {
      hq: { t: "2.468.1114", f: "2.2284.0315" },
      lab: { t: "31.427.0314", f: "31.427.0315" }
    };

    // 한글 명함용 - 직원 근무지별 주소 (본인 근무지만 표시)
    const LOCATION_ADDRESS_KO = {
      hq: {
        titleKo: "본사", subKo: "(기술연구소)",
        linesKo: ["04778 서울 성동구 왕십리로 58,", "511호-514호, 517호"],
        titleEn: "Headquarters", subEn: "(Technology R&D Center)",
        linesEn: ["#511-#514, #517, FORHU, 58, Wangsimni-ro,", "Seongdong-gu, Seoul, Republic of Korea"]
      },
      lab: {
        titleKo: "시스템연구소", subKo: "(데모/전시)",
        linesKo: ["15847 경기 군포시 공단로 117,", "1층"],
        titleEn: "System R&D Center", subEn: "(Demo/Exhibition)",
        linesEn: ["1F, 117, Gongdan-ro, Gunpo-si,", "Gyeonggi-do, Republic of Korea"]
      }
    };

    // 영문 명함용 - 근무지와 무관하게 항상 본사 + 시스템연구소(데모/전시) 두 곳을 함께 표기
    const EN_CARD_ADDRESSES = [
      {
        title: "Headquarters", sub: "(Technology R&D Center)",
        lines: ["#511-#514, #517, FORHU, 58, Wangsimni-ro,", "Seongdong-gu, Seoul, Republic of Korea"]
      },
      {
        title: "System R&D Center", sub: "(Demo/Exhibition)",
        lines: ["1F, 117, Gongdan-ro, Gunpo-si,", "Gyeonggi-do, Republic of Korea"]
      }
    ];

    function App() {
      // Identity Verification State
      const [isVerified, setIsVerified] = useState(false);
      const [authInput, setAuthInput] = useState({ name: "", birth: "" });
      const [authError, setAuthError] = useState("");

      // Employee Roster (remote GitHub JSON, with local fallback)
      const [employees, setEmployees] = useState(DEFAULT_EMPLOYEES);
      const [rosterSource, setRosterSource] = useState("default"); // "default" | "remote"

      useEffect(() => {
        let cancelled = false;
        fetch(EMPLOYEES_URL, { cache: "no-store" })
          .then((res) => { if (!res.ok) throw new Error("fetch failed"); return res.json(); })
          .then((list) => {
            if (!cancelled && Array.isArray(list) && list.length > 0) {
              setEmployees(list);
              setRosterSource("remote");
            }
          })
          .catch(() => { /* keep DEFAULT_EMPLOYEES demo fallback */ });
        return () => { cancelled = true; };
      }, []);

      // Hover state for linking download buttons to preview card outlines
      const [hoveredSide, setHoveredSide] = useState(null); // 'front' | 'back' | null

      // Language segment: 'ko' | 'en'
      const [lang, setLang] = useState("ko");

      // Business Card Customization State
      const [locationType, setLocationType] = useState("hq");

      const [nameKo, setNameKo] = useState("지 현 경");
      const [nameEn, setNameEn] = useState("JEE, HYUNKYUNG");
      const [deptKo, setDeptKo] = useState("성장전략 | 인사");
      const [deptEn, setDeptEn] = useState("Growth Strategy | HR");
      const [titleKo, setTitleKo] = useState("책임매니저");
      const [titleEn, setTitleEn] = useState("Senior Manager");
      const [mobile, setMobile] = useState("10.5019.3659");
      const [email, setEmail] = useState("hkjee");

      const [exportFormat, setExportFormat] = useState("png");
      const [isExporting, setIsExporting] = useState(false);
      const [exportSuccessMsg, setExportSuccessMsg] = useState("");

      const activeLocationPhone = LOCATION_PHONE[locationType] || LOCATION_PHONE.hq;
      const koAddress = LOCATION_ADDRESS_KO[locationType] || LOCATION_ADDRESS_KO.hq;

      // 앞면 주소 섹션에 그릴 블록 목록: 한글 모드 = 본인 근무지(한/영) / 영문 모드 = 본사+시스템연구소 고정 2곳
      const addressBlocks = lang === "ko"
        ? [
            { title: koAddress.titleKo, sub: koAddress.subKo, lines: koAddress.linesKo, fontFamily: "Pretendard, sans-serif" },
            { title: koAddress.titleEn, sub: koAddress.subEn, lines: koAddress.linesEn, fontFamily: "Inter, Pretendard, sans-serif" }
          ]
        : EN_CARD_ADDRESSES.map((a) => ({ ...a, fontFamily: "Inter, Pretendard, sans-serif" }));

      const handleVerify = (e) => {
        if (e) e.preventDefault();
        setAuthError("");

        const matched = employees.find(
          (emp) => emp.name.trim() === authInput.name.trim() &&
                   emp.birth.trim() === authInput.birth.trim()
        );

        if (matched) {
          setIsVerified(true);
          setNameKo(matched.nameKo);
          setNameEn(matched.nameEn);
          setDeptKo(matched.deptKo);
          setDeptEn(matched.deptEn);
          setTitleKo(matched.titleKo);
          setTitleEn(matched.titleEn);
          setMobile(matched.mobile);
          setEmail(matched.email);
          setLocationType(matched.location || "hq");
        } else {
          setAuthError("입력하신 정보와 일치하는 임직원 정보가 없습니다.");
        }
      };

      const handleDemoBypass = (employee) => {
        setAuthInput({
          name: employee.name,
          birth: employee.birth
        });
        setAuthError("");
      };

      const exportCardImage = async (elementId, filename) => {
        const cardElement = document.getElementById(elementId);
        if (!cardElement) return;

        try {
          setIsExporting(true);

          if (document.fonts && document.fonts.ready) {
            await document.fonts.ready;
          }

          const canvas = await html2canvas(cardElement, {
            scale: 8,
            useCORS: true,
            allowTaint: true,
            backgroundColor: null,
            logging: false,
            onclone: (clonedDoc) => {
              const clonedTarget = clonedDoc.getElementById(elementId);
              if (clonedTarget) {
                clonedTarget.style.transform = 'none';
                clonedTarget.style.position = 'relative';
                clonedTarget.style.top = '0';
                clonedTarget.style.left = '0';
              }
            }
          });

          const image = canvas.toDataURL(`image/${exportFormat}`, 1.0);
          const link = document.createElement("a");
          link.href = image;
          const displayName = (lang === "ko" ? nameKo : nameEn).replace(/\s+/g, '');
          link.download = `${filename}_${lang.toUpperCase()}_${displayName}_CLE_Robotics.${exportFormat}`;
          link.click();

          setExportSuccessMsg(`${filename === "Front" ? "앞면" : "뒷면"} 명함 이미지가 성공적으로 추출되었습니다`);
          setTimeout(() => setExportSuccessMsg(""), 3000);
        } catch (error) {
          console.error("Export Error:", error);
          alert("이미지 추출 중 오류가 발생했습니다. 다시 시도해 주세요.");
        } finally {
          setIsExporting(false);
        }
      };

      return (
        <div className="h-screen overflow-hidden bg-[#F8F9FB] text-slate-800 flex flex-col font-sans">

          {/* 상단 메뉴바 */}
          <header className="bg-white/80 backdrop-blur-xl border-b border-slate-200/60 px-6 py-4 flex items-center justify-between z-10 relative shrink-0 shadow-[0_1px_3px_rgba(0,0,0,0.01)]">
            <div className="flex items-center gap-3">
              <div className="h-10 w-10 rounded-xl overflow-hidden border border-slate-200 bg-white shadow-[0_1px_2px_rgba(0,0,0,0.03)] flex items-center justify-center shrink-0">
                <img
                  alt="CLE ROBOTICS Logo"
                  className="w-full h-full object-contain p-1.5"
                  src="https://raw.githubusercontent.com/cle-vision/cle-tools/main/logo-ko.png"
                  onError={(e) => {
                    e.target.onerror = null;
                    e.target.src = "https://placehold.co/40x40/ffffff/ee2a2e?text=CLE";
                  }}
                />
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <span className="text-base font-bold tracking-tight bg-gradient-to-r from-slate-900 to-slate-700 bg-clip-text text-transparent">Business card export</span>
                </div>
                <p className="text-[10px] text-slate-400 font-medium">명함 이미지 다운로드</p>
              </div>
            </div>
          </header>

          {}
          {!isVerified && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl shadow-2xl border border-slate-100 max-w-md w-full p-6 space-y-6 relative">
                <div className="text-center space-y-2">
                  <h2 className="text-xl font-bold text-slate-800">임직원 본인 인증</h2>
                  <p className="text-xs text-slate-500">CLE Robotics 명함 생성을 위해 정보를 입력해 주세요.</p>
                </div>

                <form onSubmit={handleVerify} className="space-y-4">
                  <div>
                    <label className="text-[11px] font-bold text-slate-400 block mb-1">성명</label>
                    <input
                      type="text"
                      placeholder="예: 지현경"
                      value={authInput.name}
                      onChange={(e) => setAuthInput({...authInput, name: e.target.value})}
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs font-semibold focus:outline-none focus:border-[#FF4747] transition-all"
                      required
                    />
                  </div>

                  <div>
                    <label className="text-[11px] font-bold text-slate-400 block mb-1">생년월일 (4자리: MMDD)</label>
                    <input
                      type="text"
                      maxLength="4"
                      placeholder="예: 0520 (5월 20일)"
                      value={authInput.birth}
                      onChange={(e) => setAuthInput({...authInput, birth: e.target.value})}
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs font-semibold focus:outline-none focus:border-[#FF4747] transition-all"
                      required
                    />
                  </div>

                  {authError && (
                    <div className="p-3 bg-red-50 border border-red-100 rounded-xl text-red-600 text-xs font-semibold text-center">
                      {authError}
                    </div>
                  )}

                  <div className="flex gap-2">
                    <button
                      type="button"
                      onClick={() => window.history.back()}
                      className="flex-1 py-3 bg-slate-100 hover:bg-slate-200 text-slate-500 rounded-xl text-xs font-bold transition-all"
                    >
                      취소
                    </button>
                    <button
                      type="submit"
                      className="flex-[2] py-3 bg-[#FF4747] hover:bg-[#FF4747]/90 text-white rounded-xl text-xs font-bold transition-all shadow-md shadow-red-100"
                    >
                      인증 확인 및 명함 생성하기
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* 추출 완료 토스트 메시지 */}
          <div
            className={`fixed bottom-8 left-1/2 -translate-x-1/2 z-[60] transition-all duration-300 ease-out ${
              exportSuccessMsg ? "opacity-100 translate-y-0" : "opacity-0 translate-y-3 pointer-events-none"
            }`}
          >
            <div className="flex items-center gap-2 bg-slate-900 text-white text-xs font-bold pl-4 pr-5 py-3 rounded-full shadow-lg shadow-black/30">
              <span className="text-emerald-400 text-sm">✓</span>
              {exportSuccessMsg}
            </div>
          </div>

          {}
          <main className="flex-1 flex flex-col items-center p-6 md:p-8 overflow-y-auto min-h-0">
            <div className="max-w-[1320px] w-full h-full flex flex-col gap-6">

              {/* Header Controls */}
              <div className="flex items-center justify-between border-b border-slate-200/80 pb-4 gap-4 shrink-0 flex-wrap">

                <span className="text-sm font-bold text-slate-700">명함 미리보기</span>

                <div className="flex items-center gap-3 flex-wrap justify-end">
                  {/* 한글/영문 세그먼트 컨트롤 */}
                  <div className="flex items-center gap-1 bg-slate-100 rounded-full p-1">
                    <button
                      onClick={() => setLang("ko")}
                      className={`px-4 py-2 rounded-full text-xs font-bold transition-all ${lang === "ko" ? "bg-white shadow text-[#FF4747]" : "text-slate-400 hover:text-slate-600"}`}
                    >
                      한글
                    </button>
                    <button
                      onClick={() => setLang("en")}
                      className={`px-4 py-2 rounded-full text-xs font-bold transition-all ${lang === "en" ? "bg-white shadow text-[#FF4747]" : "text-slate-400 hover:text-slate-600"}`}
                    >
                      English
                    </button>
                  </div>

                  <button
                    onClick={() => exportCardImage("card-front-target", "Front")}
                    onMouseEnter={() => setHoveredSide("front")}
                    onMouseLeave={() => setHoveredSide(null)}
                    disabled={isExporting}
                    className="px-5 py-2.5 bg-slate-800 hover:bg-[#FF4747] text-white rounded-xl text-xs font-bold transition-all shadow-sm disabled:opacity-50"
                  >
                    {isExporting ? "추출 중..." : "앞면 다운로드"}
                  </button>
                  <button
                    onClick={() => exportCardImage("card-back-target", "Back")}
                    onMouseEnter={() => setHoveredSide("back")}
                    onMouseLeave={() => setHoveredSide(null)}
                    disabled={isExporting}
                    className="px-5 py-2.5 bg-slate-800 hover:bg-[#FF4747] text-white rounded-xl text-xs font-bold transition-all shadow-sm disabled:opacity-50"
                  >
                    {isExporting ? "추출 중..." : "뒷면 다운로드"}
                  </button>
                </div>
              </div>


              {}
              <div className="bg-[#EFEFEF] border border-slate-200 rounded-2xl shadow-sm p-6 md:p-10 flex flex-col lg:flex-row flex-wrap items-center justify-center gap-8 lg:gap-10 overflow-auto flex-1 min-h-0">

                {/* FRONT SIDE CARD */}
                <div className="flex flex-col items-center gap-3">
                  <span className="text-xs font-bold text-slate-400 uppercase tracking-wider">앞면</span>

                  <div className={`card-dimension rounded-xl shadow-lg overflow-hidden bg-white border border-slate-200 transition-all ${
                    hoveredSide === 'front' ? 'outline outline-4 outline-black' : ''
                  }`}>
                    <div id="card-front-target" className="card-inner-exact">

                      {/* CLE ROBOTICS 로고 이미지 (business card 폴더 내 index.html과 동일 경로, SVG - 고해상도 추출 시 깨지지 않음) */}
                      <div style={{ position: "absolute", left: "5.69%", top: "12px", width: "46px", height: "19px" }}>
                        <img
                          alt="CLE ROBOTICS Symbol"
                          style={{ width: "100%", height: "100%", objectFit: "contain", display: "block" }}
                          src="logo-card.svg"
                          onError={(e) => {
                            e.target.onerror = null;
                            e.target.src = "https://placehold.co/66x22/ffffff/ee2a2e?text=CLE";
                          }}
                        />
                      </div>

                      {/* 클레로보틱스 주식회사 / CLE Robotics Inc. (영문모드: 이메일 텍스트와 세로 정렬) */}
                      <p style={{
                        position: "absolute", top: "8.87%",
                        ...(lang === "ko" ? { right: "30.12%" } : { left: "110.6px" }),
                        fontFamily: "Pretendard, sans-serif", fontWeight: 700, fontStyle: "normal",
                        fontSize: "7.5px", color: "black", whiteSpace: "nowrap", wordBreak: "break-word", lineHeight: "normal", margin: 0
                      }}>
                        {lang === "ko" ? "클레로보틱스 주식회사" : "CLE Robotics Inc."}
                      </p>

                      {/* 우측 정보 전체 블록 (연락처 + 구분선 + 주소) */}
                      <div style={{
                        position: "absolute",
                        left: "105px",
                        bottom: "8.01%",
                        width: "148px",
                        display: "flex",
                        flexDirection: "column",
                        gap: "6px",
                        alignItems: "flex-start"
                      }}>

                        {/* 연락처 그룹 */}
                        <div style={{ display: "flex", gap: "5px", alignItems: "stretch" }}>
                          {/* 구분선 1 */}
                          <div style={{ width: "0.6px", background: "#EE272C", flexShrink: 0 }}></div>

                          {/* 연락처 내역 */}
                          <div style={{
                            display: "flex", flexDirection: "column", gap: "2px", alignItems: "flex-start",
                            fontFamily: "Pretendard, sans-serif", fontWeight: 500, fontStyle: "normal",
                            fontSize: "6.7px", color: "black", lineHeight: "normal", wordBreak: "break-word"
                          }}>
                            <p style={{ margin: 0 }}>{email}@clerobotics.com</p>
                            <p style={{ margin: 0 }}>Mobile: +82.{mobile}</p>
                            <p style={{ margin: 0 }}>Office: +82.{activeLocationPhone.t}</p>
                            <p style={{ margin: 0 }}>Fax: +82.{activeLocationPhone.f}</p>
                          </div>
                        </div>

                        {/* 주소 그룹 (한글모드: 본인 근무지 한/영 · 영문모드: 본사+시스템연구소 고정 2곳) */}
                        <div style={{ display: "flex", gap: "5px", alignItems: "stretch" }}>
                          {/* 구분선 2 */}
                          <div style={{ width: "0.6px", background: "#EE272C", flexShrink: 0 }}></div>

                          {/* 주소 섹션 */}
                          <div style={{
                            display: "flex", flexDirection: "column", gap: "3px", alignItems: "flex-start",
                            fontStyle: "normal", color: "#727272", wordBreak: "break-word"
                          }}>

                            {addressBlocks.map((block, idx) => (
                              <div key={idx} style={{ display: "flex", flexDirection: "column", gap: "2px", alignItems: "flex-start", width: "142px", flexShrink: 0, fontFamily: "Pretendard, sans-serif", fontWeight: 500 }}>
                                <div style={{ display: "flex", gap: "2px", alignItems: "center", lineHeight: "normal", whiteSpace: "nowrap", flexShrink: 0 }}>
                                  <p style={{ fontSize: "6.7px", margin: 0 }}>{block.title}</p>
