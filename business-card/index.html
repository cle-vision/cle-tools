<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CLE Robotics - 디지털 명함 이미지 다운로드</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>
  <!-- html2canvas for Image Export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <!-- Google Fonts & Pretendard -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&family=Noto+Sans+JP:wght@400;500;700;900&family=Montserrat:wght@400;600;700;800&family=Inter:wght@500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: 'Noto Sans KR', sans-serif; }
    .font-montserrat { font-family: 'Montserrat', sans-serif; }
    /* Standard Business Card Dimension - 실제 인쇄 규격 90mm x 50mm(9:5) 비율의 스케일 컨테이너
       - 모바일 반응형 대응: 고정 height 대신 aspect-ratio로 비율을 유지한 채 폭에 맞춰 자동으로 줄어든다.
         (실제 배율(transform: scale)은 JS에서 컨테이너 실측 폭 기준으로 계산해 인라인으로 적용한다) */
    .card-dimension {
      width: 500px;
      max-width: 100%;
      aspect-ratio: 90 / 50;
    }
    /* 모바일 화면에서는 명함 미리보기 자체를 더 작게 줄인다. aspect-ratio가 있어 비율은 그대로 유지된다. */
    @media (max-width: 640px) {
      .card-dimension {
        max-width: 78%;
      }
    }
    /* Target scale card matching exact proportion - 90mm x 50mm(9:5) 비율을 그대로 반영 (height 153px는 기존 유지, width만 9:5 비율로 재계산) */
    .card-inner-exact {
      width: 275.4px;
      height: 153px;
      position: relative;
      background: white;
      overflow: hidden;
      transform-origin: 0 0;
    }
  </style>
</head>
<body class="bg-[#F8F9FB] text-slate-800">
  <div id="root"></div>
  <script type="text/babel" data-presets="react,env">
    const { useState, useEffect, useRef } = React;
    /*
      ────────────────────────────────────────────────────────────────
      직원 명단 데이터 소스
      ────────────────────────────────────────────────────────────────
      실제 60명 규모 명단은 GitHub 저장소(cle-vision/cle-tools)의
      "employees.json" 파일에서 fetch 해옵니다 (로고 이미지와 동일한 저장소/브랜치 가정).
      해당 파일이 없거나 fetch 에 실패하면 아래 DEFAULT_EMPLOYEES(데모 2인)로 동작합니다.
      employees.json 스키마 (배열, 각 원소는 아래 형태의 평면 객체):
      {
        "name": "지현경",          // 성명 (인증용)
        "birth": "0520",           // 생년월일 4자리 MMDD (인증용)
        "nameKo": "지 현 경",
        "nameEn": "JEE, HYUNKYUNG",
        "deptKo": "성장전략 | 인사",
        "deptEn": "Growth Strategy | HR",
        "titleKo": "책임매니저",
        "titleEn": "Senior Manager",
        "mobile": "10.5019.3659", // 010-XXXX-XXXX 중 10.XXXX.XXXX 형태
        "email": "hkjee",          // @clerobotics.com 앞부분만
        "location": "hq"           // "hq" 또는 "lab"
      }
    */
    const EMPLOYEES_URL = "https://raw.githubusercontent.com/cle-vision/cle-tools/main/business-card/employees.json";
    const DEFAULT_EMPLOYEES = [
      {
        name: "지현경",
        birth: "0302",
        nameKo: "지 현 경",
        nameEn: "JEE, HYUNKYUNG",
        deptKo: "성장전략 | 인사",
        deptEn: "Growth Strategy | HR",
        titleKo: "책임매니저 | 리드",
        titleEn: "Senior Manager | Lead",
        mobile: "10.5019.3659",
        email: "hkjee",
        location: "hq"
      }
    ];
    // 본사 / 시스템연구소 대표번호·팩스 (전화/팩스는 근무지 공통 정보)
    const LOCATION_PHONE = {
      hq: { t: "2.468.1114", f: "2.2284.0135" },
      lab: { t: "31.427.0314", f: "31.427.0315" }
    };
    // 한글 명함용 - 직원 근무지별 주소 (본인 근무지만 표시)
    const LOCATION_ADDRESS_KO = {
      hq: {
        titleKo: "본사", subKo: "(기술연구소)",
        linesKo: ["04778 서울 성동구 왕십리로 58,", "511호-514호, 517호"],
        titleEn: "Headquarters", subEn: "(Technology R&D Center)",
        linesEn: ["#511-#514, #517, FORHU, 58, Wangsimni-ro,", "Seongdong-gu, Seoul, Republic of Korea"]
      },
      lab: {
        titleKo: "시스템연구소", subKo: "(데모/전시)",
        linesKo: ["15847 경기 군포시 공단로 117, 1층"],
        titleEn: "System R&D Center", subEn: "(Demo/Exhibition)",
        linesEn: ["1F, 117, Gongdan-ro, Gunpo-si,", "Gyeonggi-do, Republic of Korea"]
      }
    };
    // 영문 명함용 - 근무지와 무관하게 항상 본사 + 시스템연구소(데모/전시) 두 곳을 함께 표기
    const EN_CARD_ADDRESSES = [
      {
        title: "Headquarters", sub: "(Technology R&D Center)",
        lines: ["#511-#514, #517, FORHU, 58, Wangsimni-ro,", "Seongdong-gu, Seoul, Republic of Korea"]
      },
      {
        title: "System R&D Center", sub: "(Demo/Exhibition)",
        lines: ["1F, 117, Gongdan-ro, Gunpo-si,", "Gyeonggi-do, Republic of Korea"]
      }
    ];
    // 일본어 명함용 - 근무지와 무관하게 항상 본사 주소만 일본어로 표기 (일본어 지원 임직원 전용)
    const LOCATION_ADDRESS_JA = {
      hq: {
        titleJa: "本社", subJa: "（技術研究所）",
        linesJa: ["04778 ソウル特別市 城東区 往十里路 58", "往十里路 58 FORHU 511号-514号、 517号"]
      }
    };
    // 좌측 이름/부서(파트)/직급 블록과 우측 연락처·주소 블록 사이의 레이아웃 상수.
    // 부서(파트)명이 길어지면(예: "Growth Strategy | Procurement & Logistics") 텍스트가
    // 우측 블록의 구분선(border-left)에 겹치거나 너무 붙어 보일 수 있어, 구분선 좌측에 5px의
    // 여유 공간(버퍼)을 두고, 그 안에 들어가지 않으면 겹치지 않을 만큼만 폰트 크기를 줄인다.
    const DEPT_LEFT_X = 14.51; // 좌측 이름/부서/직급 블록의 left 위치(px)
    const INFO_BLOCK_X = 125.4; // 우측 연락처/주소 블록의 left 위치(px, 구분선이 시작되는 지점)
    const DEPT_DIVIDER_BUFFER = 5; // 구분선 좌측에 확보할 여유 공간(px, 웹 미리보기 기준)
    const DEPT_MAX_WIDTH = INFO_BLOCK_X - DEPT_DIVIDER_BUFFER - DEPT_LEFT_X; // ≈ 105.89px
    const DEPT_MIN_FONT_SIZE = 4.2; // 너무 작아져 가독성이 떨어지지 않도록 하는 최소 폰트 크기(px)
    let __measureCanvasCtx = null;
    // 캔버스 2D context로 텍스트의 실제 렌더링 너비를 측정해, maxWidthPx를 넘으면 딱 맞는 만큼만 폰트 크기를 줄여 반환한다.
    // (브라우저 레이아웃을 직접 두 번 렌더링/측정하는 대신 계산으로 처리 - 미리보기와 추출 이미지에 동일하게 적용된다)
    function getFitFontSize(text, baseFontSizePx, maxWidthPx, fontWeight, fontFamily) {
      if (!text) return baseFontSizePx;
      try {
        if (!__measureCanvasCtx) __measureCanvasCtx = document.createElement("canvas").getContext("2d");
        __measureCanvasCtx.font = `${fontWeight} ${baseFontSizePx}px ${fontFamily}`;
        const width = __measureCanvasCtx.measureText(text).width;
        if (width <= maxWidthPx || width <= 0) return baseFontSizePx;
        const scaled = baseFontSizePx * (maxWidthPx / width);
        return Math.max(scaled, DEPT_MIN_FONT_SIZE);
      } catch (e) {
        return baseFontSizePx;
      }
    }
    // 지정한 폰트로 실제 렌더링되는 텍스트의 너비(px)를 캔버스 2D context로 측정한다.
    // (일본어 명함의 "本社 （技術研究所）"처럼, 특정 글자 폭의 절반만큼만 간격을 좁히는 등
    // 폰트에 따라 달라지는 미세 간격 보정에 사용 - 실제 사용자 브라우저에 로드된 폰트 기준으로 측정되므로
    // 어떤 폰트가 최종적으로 적용되든 항상 정확하다)
    function getTextWidth(text, fontSpec) {
      if (!text) return 0;
      try {
        if (!__measureCanvasCtx) __measureCanvasCtx = document.createElement("canvas").getContext("2d");
        __measureCanvasCtx.font = fontSpec;
        return __measureCanvasCtx.measureText(text).width;
      } catch (e) {
        return 0;
      }
    }
    function App() {
      // Identity Verification State
      const [isVerified, setIsVerified] = useState(false);
      const [authInput, setAuthInput] = useState({ name: "", birth: "" });
      const [authError, setAuthError] = useState("");
      // Employee Roster (remote GitHub JSON, with local fallback)
      const [employees, setEmployees] = useState(DEFAULT_EMPLOYEES);
      const [rosterSource, setRosterSource] = useState("default"); // "default" | "remote"
      useEffect(() => {
        let cancelled = false;
        fetch(EMPLOYEES_URL, { cache: "no-store" })
          .then((res) => { if (!res.ok) throw new Error("fetch failed"); return res.json(); })
          .then((list) => {
            if (!cancelled && Array.isArray(list) && list.length > 0) {
              setEmployees(list);
              setRosterSource("remote");
            }
          })
          .catch(() => { /* keep DEFAULT_EMPLOYEES demo fallback */ });
        return () => { cancelled = true; };
      }, []);
      // Hover state for linking download buttons to preview card outlines
      const [hoveredSide, setHoveredSide] = useState(null); // 'front' | 'back' | null
      // 모바일 반응형 대응: 카드 컨테이너(card-dimension)의 실제 렌더링 폭에 맞춰
      // 내부 255x153 고정 박스(card-inner-exact)의 배율을 동적으로 계산해 적용한다.
      // (이미지 추출 시에는 onclone에서 transform을 항상 'none'으로 초기화하므로 이 값과 무관하게 원본 해상도로 캡처된다)
      const frontCardRef = useRef(null);
      const backCardRef = useRef(null);
      const [frontScale, setFrontScale] = useState(1.96);
      const [backScale, setBackScale] = useState(1.96);
      useEffect(() => {
        const CARD_BASE_WIDTH = 275.4; // card-inner-exact 기준 폭(px) - 90mm x 50mm 비율 기준
        const computeScale = (el, setter) => {
          if (!el || el.clientWidth === 0) return;
          setter(el.clientWidth / CARD_BASE_WIDTH);
        };
        const frontEl = frontCardRef.current;
        const backEl = backCardRef.current;
        computeScale(frontEl, setFrontScale);
        computeScale(backEl, setBackScale);
        if (typeof ResizeObserver === "undefined") return;
        const ro = new ResizeObserver(() => {
          computeScale(frontCardRef.current, setFrontScale);
          computeScale(backCardRef.current, setBackScale);
        });
        if (frontEl) ro.observe(frontEl);
        if (backEl) ro.observe(backEl);
        return () => ro.disconnect();
      }, []);
      // Language segment: 'ko' | 'en'
      const [lang, setLang] = useState("ko");
      // Business Card Customization State
      const [locationType, setLocationType] = useState("hq");
      // 인증 전 배경에 노출되는 초기 미리보기 값 - 실제 임직원 정보가 아닌 가상의 예시 인물(홍길동)로 표기
      const [nameKo, setNameKo] = useState("홍 길 동");
      const [nameEn, setNameEn] = useState("HONG, GILDONG");
      const [deptKo, setDeptKo] = useState("홍보팀");
      const [deptEn, setDeptEn] = useState("PR Team");
      const [titleKo, setTitleKo] = useState("매니저");
      const [titleEn, setTitleEn] = useState("Manager");
      const [mobile, setMobile] = useState("10.1234.5678");
      const [email, setEmail] = useState("hong");
      // 일본어 명함 지원 임직원 전용 데이터 (한자 이름 - 가타카나 읽기 그룹, 부서, 직급). 미지원 임직원은 null/빈 값 유지.
      const [nameJaGroups, setNameJaGroups] = useState(null);
      const [deptJa, setDeptJa] = useState("");
      const [titleJa, setTitleJa] = useState("");
      const [exportFormat, setExportFormat] = useState("png");
      const [isExporting, setIsExporting] = useState(false);
      const [exportSuccessMsg, setExportSuccessMsg] = useState("");
      // 영문/일본어 명함은 근무지(본사/시스템연구소)와 무관하게 Office/Fax를 항상 본사 번호로 표기
      const activeLocationPhone = (lang === "en" || lang === "ja") ? LOCATION_PHONE.hq : (LOCATION_PHONE[locationType] || LOCATION_PHONE.hq);
      const koAddress = LOCATION_ADDRESS_KO[locationType] || LOCATION_ADDRESS_KO.hq;
      const jaAddress = LOCATION_ADDRESS_JA[locationType] || LOCATION_ADDRESS_JA.hq;
      const hasJapanese = Boolean(nameJaGroups && nameJaGroups.length);
      // 부서(파트)가 없는 임직원(대표이사/CTO/CPO 등) 대응: 부서 텍스트가 비어있으면 부서 블록을 통째로 건너뛴다.
      const deptText = lang === "ko" ? deptKo : (lang === "ja" ? deptJa : deptEn);
      const hasDept = Boolean(deptText && deptText.trim());
      // 부서(파트)명/직급명이 길어 우측 블록 구분선에 겹치지 않도록, 특정 인원에 한정하지 않고
      // 좌측 블록(이름/부서/직급)에 들어가는 모든 텍스트에 공통으로 적용 - 필요한 경우에만 폰트 크기를 축소한다.
      const deptFontFamily = lang === "ja" ? "'Noto Sans JP', sans-serif" : "Pretendard, sans-serif";
      const deptFontSize = getFitFontSize(deptText, 5.9, DEPT_MAX_WIDTH, 500, deptFontFamily);
      const deptSubFontSize = lang === "ko" ? getFitFontSize(deptEn, 5, DEPT_MAX_WIDTH, 500, "Pretendard, sans-serif") : 5;
      const titleText = lang === "ko" ? titleKo : (lang === "ja" ? titleJa : titleEn);
      const titleFontFamily = lang === "ja" ? "'Noto Sans JP', sans-serif" : "Pretendard, sans-serif";
      const titleFontSize = getFitFontSize(titleText, 5.9, DEPT_MAX_WIDTH, 500, titleFontFamily);
      const titleSubFontSize = lang === "ko" ? getFitFontSize(titleEn, 5, DEPT_MAX_WIDTH, 500, "Pretendard, sans-serif") : 5;
      // 앞면 주소 섹션에 그릴 블록 목록: 한글 모드 = 본인 근무지(한/영) / 영문 모드 = 본사+시스템연구소 고정 2곳 / 일본어 모드 = 본사 1곳(일본어 전용)
      const addressBlocks = lang === "ko"
        ? [
            { title: koAddress.titleKo, sub: koAddress.subKo, lines: koAddress.linesKo, fontFamily: "Pretendard, sans-serif" },
            { title: koAddress.titleEn, sub: koAddress.subEn, lines: koAddress.linesEn, fontFamily: "Inter, Pretendard, sans-serif" }
          ]
        : lang === "ja"
        ? [
            { title: jaAddress.titleJa, sub: jaAddress.subJa, lines: jaAddress.linesJa, fontFamily: "'Noto Sans JP', sans-serif" }
          ]
        : EN_CARD_ADDRESSES.map((a) => ({ ...a, fontFamily: "Inter, Pretendard, sans-serif" }));
      // 일본어 명함의 주소 타이틀("本社")과 괄호 설명("（技術研究所）") 사이 간격이 폰트 특성상 넓어 보여서,
      // "技" 글자 실제 렌더링 폭의 절반만큼 간격을 좁힌다. 실제 사용자 브라우저에 로드된 폰트 기준으로
      // 측정하므로, 어떤 폰트가 최종 적용되든 정확히 그 폭의 절반만큼만 좁혀진다.
      const jaAddressGapReduction = lang === "ja" ? getTextWidth("技", "400 6.7px 'Noto Sans KR', sans-serif") / 2 : 0;
      const handleVerify = (e) => {
        if (e) e.preventDefault();
        setAuthError("");
        const matched = employees.find(
          (emp) => emp.name.trim() === authInput.name.trim() &&
                   emp.birth.trim() === authInput.birth.trim()
        );
        if (matched) {
          setIsVerified(true);
          setNameKo(matched.nameKo);
          setNameEn(matched.nameEn);
          setDeptKo(matched.deptKo);
          setDeptEn(matched.deptEn);
          setTitleKo(matched.titleKo);
          setTitleEn(matched.titleEn);
          setMobile(matched.mobile);
          setEmail(matched.email);
          setLocationType(matched.location || "hq");
          setNameJaGroups(matched.nameJaGroups || null);
          setDeptJa(matched.deptJa || "");
          setTitleJa(matched.titleJa || "");
          // 방금 확인한 임직원이 일본어 명함을 지원하지 않는데 이전에 일본어 탭이 선택되어 있었다면,
          // 존재하지 않는 데이터로 빈 카드가 보이지 않도록 한글 탭으로 되돌린다.
          if (!matched.nameJaGroups && lang === "ja") setLang("ko");
        } else {
          setAuthError("입력하신 정보와 일치하는 임직원 정보가 없습니다.");
        }
      };
      const handleDemoBypass = (employee) => {
        setAuthInput({
          name: employee.name,
          birth: employee.birth
        });
        setAuthError("");
      };
      const exportCardImage = async (elementId, filename) => {
        const cardElement = document.getElementById(elementId);
        if (!cardElement) return;
        try {
          setIsExporting(true);
          if (document.fonts && document.fonts.ready) {
            await document.fonts.ready;
          }
          const canvas = await html2canvas(cardElement, {
            scale: 8,
            useCORS: true,
            allowTaint: true,
            backgroundColor: null,
            logging: false,
            onclone: async (clonedDoc) => {
              const clonedTarget = clonedDoc.getElementById(elementId);
              if (clonedTarget) {
                clonedTarget.style.transform = 'none';
                clonedTarget.style.position = 'relative';
                clonedTarget.style.top = '0';
                clonedTarget.style.left = '0';
              }
              // html2canvas는 원본 문서와 별도의 클론 문서(iframe)를 만들어 캡처하기 때문에,
              // 이 클론 문서 안에서 웹폰트(Pretendard/Inter/Montserrat/Noto Sans JP)가 실제로 로드 완료될
              // 때까지 기다려주지 않으면 대체 폰트(fallback font)로 렌더링된다. 대체 폰트는 줄높이(ascent/
              // line-height)가 Pretendard/Noto Sans JP와 달라서, 텍스트만 로고나 구분선(border) 같은
              // 폰트와 무관한 요소들에 비해 위/아래로 밀려 보이는 현상(예: 회사명이 로고보다 아래로,
              // 구분선이 이메일/주소 텍스트보다 위로 떨어져 보이는 현상)의 실제 원인이다.
              // 클론 문서는 원본과 별도의 FontFace 인스턴스를 가지고 있어서, 단순히 clonedDoc.fonts.load()만

              // 있다. 그래서 원본 문서에서 이미 로드가 끝난(status === 'loaded') FontFace 객체 자체를
              // 클론 문서에 그대로 이식(transplant)해서, 클론이 재로딩할 필요 없이 바로 올바른 폰트로
              // 렌더링되도록 한다. 이후 load()/ready 대기는 혹시 이식이 실패한 경우를 대비한 폴백이다.
              try {

                  document.fonts.forEach((fontFace) => {
                    if (fontFace.status === "loaded") {

                    }
                  });
                }
                const fontSpecs = [
                  "500 6.7px Pretendard", "700 12px Pretendard", "500 5px Pretendard", "700 7.5px Pretendard", "500 5.9px Pretendard",
                  "500 6.7px Inter", "700 8px Montserrat", "800 8px Montserrat", "400 6px Montserrat",
                  "400 6.7px 'Noto Sans JP'", "500 6.7px 'Noto Sans JP'", "700 12px 'Noto Sans JP'", "500 5px 'Noto Sans JP'", "700 7.5px 'Noto Sans JP'", "500 5.9px 'Noto Sans JP'"
                ];

                  // fire-and-forget로 load()만 걸고 fonts.ready만 기다리면, 클론 문서(iframe)에서
                  // 새로 추가된 FontFace가 ready의 pending 집합에 아직 반영되지 않은 타이밍에

                  await Promise.all(
                    fontSpecs.map((spec) => clonedDoc.fonts.load(spec).catch(() => null))
                  );
                }
                if (clonedDoc.fonts && clonedDoc.fonts.ready) {

                }

              }

              }
            }
