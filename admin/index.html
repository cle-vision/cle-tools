<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CLE Robotics - 팀원 정보 관리자</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>

  <!-- Firebase: 임직원 명단 저장소 -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script>
    /*
      ────────────────────────────────────────────────────────────────
      PeopleDB - 임직원 명단을 Firebase에 저장/조회하는 부분 (React 밖, 일반 자바스크립트)
      ────────────────────────────────────────────────────────────────
      · employees/{자동ID}         : 전체 정보 (관리자만 읽기/쓰기)
      · employeeLookup/{해시키}     : 명함·서명 생성기 본인 확인용 사본
                                     키 = SHA-256("성명|MMDD") → 두 값을 아는 사람만 그 1명 문서를 가져올 수 있음
      · peopleMeta/seed            : GitHub employees.json 을 처음 한 번 옮겼다는 표시
      등록/수정/삭제할 때 두 곳을 항상 함께 바꾼다.
    */
    window.PeopleDB = (function () {
      var CFG = {
        apiKey: "AIzaSyAhu9F_gwlApbodDVvpAAqAHMTJyGSKJCk",
        authDomain: "cle-tools.firebaseapp.com",
        projectId: "cle-tools",
        storageBucket: "cle-tools.firebasestorage.app",
        messagingSenderId: "779365565427",
        appId: "1:779365565427:web:783b79f074f3ca53198886"
      };
      var ADMIN_EMAIL = "jobpost@clerobotics.com"; // 채용공고 편집기와 같은 관리자 계정 (비밀번호 하나로 두 페이지 사용)
      var OLD_JSON_URL = "https://raw.githubusercontent.com/cle-vision/cle-tools/main/business-card/employees.json";

      if (!window.firebase) return null;
      var app = firebase.apps.length ? firebase.app() : firebase.initializeApp(CFG);
      var auth = app.auth(), db = app.firestore();

      function sha256(t) {
        return crypto.subtle.digest("SHA-256", new TextEncoder().encode(t)).then(function (b) {
          return Array.from(new Uint8Array(b)).map(function (x) { return x.toString(16).padStart(2, "0"); }).join("");
        });
      }
      function keyOf(name, birth) { return sha256(String(name || "").trim() + "|" + String(birth || "").trim()); }
      function clean(o) { var r = Object.assign({}, o); delete r._id; delete r._order; delete r.order; delete r.updatedAt; return r; }

      // 명단 여러 명을 한 번에 저장 (이미 있는 성명+생일 조합은 건너뜀). 한 번에 최대 500건이라 나눠서 저장.
      function importList(list, existingKeys, startOrder) {
        if (!Array.isArray(list)) return Promise.reject(new Error("not-array"));
        var seen = new Set(existingKeys || []);
        return Promise.all(list.map(function (emp) { return keyOf(emp && emp.name, emp && emp.birth); })).then(function (keys) {
          var ops = [], added = 0, skipped = 0;
          list.forEach(function (emp, i) {
            if (!emp || !emp.name || !emp.birth || seen.has(keys[i])) { skipped++; return; }
            seen.add(keys[i]);
            var rec = clean(emp);
            ops.push([db.collection("employees").doc(), Object.assign({}, rec, { order: (startOrder || 0) + i, updatedAt: Date.now() })]);
            ops.push([db.doc("employeeLookup/" + keys[i]), rec]);
            added++;
          });
          var chain = Promise.resolve();
          for (var j = 0; j < ops.length; j += 400) {
            (function (part) {
              chain = chain.then(function () { var b = db.batch(); part.forEach(function (op) { b.set(op[0], op[1]); }); return b.commit(); });
            })(ops.slice(j, j + 400));
          }
          return chain.then(function () { return { added: added, skipped: skipped }; });
        });
      }

      // Firebase 명단이 비어 있으면 GitHub employees.json 에서 자동으로 옮겨오기.
      // 결과: { n: 옮긴 수, fetchFailed: GitHub 파일을 못 읽었는지 }
      function seedIfEmpty() {
        var meta = db.doc("peopleMeta/seed");
        return db.collection("employees").limit(1).get().then(function (s) {
          if (!s.empty) return { n: 0 };
          return fetch(OLD_JSON_URL, { cache: "no-store" })
            .then(function (r) { if (!r.ok) throw new Error("http " + r.status); return r.json(); })
            .then(function (list) {
              if (!Array.isArray(list) || !list.length) return { n: 0, fetchFailed: true };
              return importList(list, [], 0).then(function (res) {
                return meta.set({ at: Date.now(), count: res.added }).then(function () { return { n: res.added }; });
              });
            }, function () { return { n: 0, fetchFailed: true }; });
        });
      }

      return {
        currentUser: function () { return new Promise(function (res) { var off = auth.onAuthStateChanged(function (u) { off(); res(u); }); }); },
        signIn: function (pw) {
          return auth.setPersistence(firebase.auth.Auth.Persistence.SESSION)
            .then(function () { return auth.signInWithEmailAndPassword(ADMIN_EMAIL, pw); });
        },
        signOut: function () { return auth.signOut(); },
        seedIfEmpty: seedIfEmpty,
        importList: function (list, existing) {
          return Promise.all((existing || []).map(function (e) { return keyOf(e.name, e.birth); })).then(function (keys) {
            var maxOrder = (existing || []).reduce(function (m, e) { return Math.max(m, e._order || 0); }, 0);
            return importList(list, keys, maxOrder + 1);
          });
        },
        watch: function (onList, onError) {
          return db.collection("employees").orderBy("order").onSnapshot(function (snap) {
            onList(snap.docs.map(function (d) { var v = d.data(); return Object.assign(clean(v), { _id: d.id, _order: v.order }); }));
          }, onError);
        },
        // existing: 수정할 때 원래 항목 (신규 등록이면 null)
        save: function (record, existing) {
          var ref = existing ? db.doc("employees/" + existing._id) : db.collection("employees").doc();
          var order = existing ? existing._order : Date.now();
          return Promise.all([keyOf(record.name, record.birth), existing ? keyOf(existing.name, existing.birth) : null]).then(function (k) {
            var b = db.batch();
            b.set(ref, Object.assign({}, record, { order: order, updatedAt: Date.now() }));
            if (k[1] && k[1] !== k[0]) b.delete(db.doc("employeeLookup/" + k[1])); // 성명/생일이 바뀌면 옛 조회키 삭제
            b.set(db.doc("employeeLookup/" + k[0]), record);
            return b.commit();
          });
        },
        remove: function (emp) {
          return keyOf(emp.name, emp.birth).then(function (k) {
            var b = db.batch();
            b.delete(db.doc("employees/" + emp._id));
            b.delete(db.doc("employeeLookup/" + k));
            return b.commit();
          });
        },
        clean: clean
      };
    })();
  </script>
  <style>
    body { font-family: 'Noto Sans KR', sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="react,env">
    const { useState, useEffect, useMemo } = React;

    /*
      ────────────────────────────────────────────────────────────────
      임직원 정보 관리자 페이지 (Firebase 버전)
      ────────────────────────────────────────────────────────────────
      명함 생성기/이메일 서명 생성기가 함께 쓰는 임직원 명단을 표 형태로 보고,
      신규 등록/수정/삭제할 수 있는 관리자 도구입니다.

      · 등록/수정/삭제는 누르는 즉시 Firebase에 저장되고, 명함·서명 생성기에도 바로 반영됩니다.
        (예전처럼 JSON 파일을 내려받아 GitHub에 덮어쓸 필요가 없습니다.)
      · 처음 로그인할 때 Firebase가 비어 있으면 GitHub의 business-card/employees.json 을
        한 번만 자동으로 옮겨옵니다. 옮긴 뒤에는 GitHub의 employees.json 을 지워도 됩니다.
      · 로그인 비밀번호는 Firebase 콘솔 > Authentication 의 jobpost@clerobotics.com 계정 비밀번호입니다 (채용공고 편집기와 같은 비밀번호).
    */
    const DB = window.PeopleDB;

    const LOCATION_OPTIONS = [
      { value: "hq", label: "본사" },
      { value: "lab", label: "시스템연구소" }
    ];

    const emptyForm = {
      name: "", birth: "", nameKo: "", nameEn: "",
      deptKo: "", deptEn: "", titleKo: "", titleEn: "",
      mobile: "", email: "", location: "hq",
      hasJapanese: false, nameJaGroups: [], deptJa: "", titleJa: ""
    };

    const authErrorText = (err) => {
      const c = (err && err.code) || "";
      if (/invalid-credential|wrong-password|user-not-found|invalid-login|invalid-password/.test(c)) return "비밀번호가 일치하지 않습니다.";
      if (c.includes("too-many-requests")) return "여러 번 틀려서 잠시 막혔습니다. 몇 분 뒤 다시 시도해 주세요.";
      if (c.includes("network-request-failed")) return "인터넷 연결을 확인해 주세요.";
      if (c.includes("operation-not-allowed")) return "Firebase에서 '이메일/비밀번호' 로그인이 꺼져 있습니다.";
      return "로그인하지 못했습니다. (" + (c || "알 수 없는 오류") + ")";
    };

    function App() {
      // 관리자 로그인 (Firebase)
      const [isAuthed, setIsAuthed] = useState(false);
      const [authChecking, setAuthChecking] = useState(true);
      const [pwInput, setPwInput] = useState("");
      const [pwError, setPwError] = useState("");
      const [signingIn, setSigningIn] = useState(false);
      const [showPw, setShowPw] = useState(false);

      // 명단 데이터
      const [employees, setEmployees] = useState([]);
      const [loadState, setLoadState] = useState("loading"); // loading | loaded | error
      const [loadErrorMsg, setLoadErrorMsg] = useState("");
      const [seedFailed, setSeedFailed] = useState(false); // GitHub employees.json 자동 불러오기 실패
      const [importing, setImporting] = useState(false);
      const importInputRef = React.useRef(null);
      const [search, setSearch] = useState("");
      const [locationFilter, setLocationFilter] = useState("all"); // all | hq | lab
      const [deptFilter, setDeptFilter] = useState("all"); // all | 소프트웨어 연구개발 | 성장전략 | 하드웨어 연구개발 | 시스템 연구개발

      // 등록/수정 폼 모달
      const [showForm, setShowForm] = useState(false);
      const [editingIndex, setEditingIndex] = useState(null); // null = 신규 등록
      const [form, setForm] = useState(emptyForm);
      const [formError, setFormError] = useState("");
      const [saving, setSaving] = useState(false);

      // 삭제 확인
      const [deleteTarget, setDeleteTarget] = useState(null); // index
      const [deleting, setDeleting] = useState(false);

      // 완료 토스트
      const [toastMsg, setToastMsg] = useState("");
      const showToast = (msg) => { setToastMsg(msg); setTimeout(() => setToastMsg(""), 4000); };

      // 이 탭에서 이미 로그인한 상태면 비밀번호를 다시 묻지 않음
      useEffect(() => {
        if (!DB) { setAuthChecking(false); return; }
        DB.currentUser().then((u) => { if (u) setIsAuthed(true); }).finally(() => setAuthChecking(false));
      }, []);

      // 로그인 후: (처음 한 번) GitHub 명단 옮기기 → 실시간 명단 구독
      useEffect(() => {
        if (!isAuthed || !DB) return;
        let unsub = null, cancelled = false;
        DB.seedIfEmpty()
          .then((r) => {
            if (r && r.n > 0) showToast(`GitHub의 employees.json에서 ${r.n}명을 Firebase로 옮겼습니다.`);
            if (r && r.fetchFailed) setSeedFailed(true);
          })
          .catch((err) => {
            setLoadState("error");
            setLoadErrorMsg(err && err.code === "permission-denied"
              ? "Firebase 접근이 거부되었습니다. Firestore 규칙 탭에 새 규칙(employees, employeeLookup 포함)을 붙여넣고 [게시]했는지 확인해 주세요."
              : "Firebase에 연결하지 못했습니다. (" + ((err && (err.code || err.message)) || "오류") + ")");
          })
          .then(() => {
            if (cancelled) return;
            unsub = DB.watch(
              (list) => { setEmployees(list); setLoadState("loaded"); },
              (err) => {
                setLoadState("error");
                setLoadErrorMsg(err && err.code === "permission-denied"
                  ? "명단 접근이 거부되었습니다. Firestore 보안 규칙을 게시했는지 확인해 주세요."
                  : "명단을 불러오지 못했습니다. 새로고침 후 다시 시도해 주세요.");
              }
            );
          });
        return () => { cancelled = true; if (unsub) unsub(); };
      }, [isAuthed]);

      const handlePasswordSubmit = (e) => {
        e.preventDefault();
        if (!DB) { setPwError("Firebase를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요."); return; }
        setSigningIn(true);
        setPwError("");
        DB.signIn(pwInput.trim())
          .then(() => { setIsAuthed(true); setPwInput(""); })
          .catch((err) => setPwError(authErrorText(err)))
          .finally(() => setSigningIn(false));
      };

      const handleSignOut = () => {
        DB.signOut().then(() => { setIsAuthed(false); setEmployees([]); setLoadState("loading"); });
      };

      const DEPT_CATEGORIES = ["소프트웨어 연구개발", "성장전략", "하드웨어 연구개발", "시스템 연구개발"];

      const filteredEmployees = useMemo(() => {
        let list = employees;
        if (locationFilter !== "all") {
          list = list.filter((emp) => (emp.location || "hq") === locationFilter);
        }
        if (deptFilter !== "all") {
          list = list.filter((emp) => (emp.deptKo || "").startsWith(deptFilter));
        }
        if (search.trim()) {
          const q = search.trim().toLowerCase();
          list = list.filter((emp) =>
            [emp.name, emp.nameKo, emp.nameEn, emp.deptKo, emp.deptEn, emp.email]
              .filter(Boolean)
              .some((v) => v.toLowerCase().includes(q))
          );
        }
        return list;
      }, [employees, search, locationFilter, deptFilter]);

      // 이미 등록된 임직원들의 부서(파트)/직급 조합을 프리셋으로 추출 (중복 제거, 가나다순).
      const deptPresets = useMemo(() => {
        const seen = new Map();
        employees.forEach((emp) => {
          if (!emp.deptKo && !emp.deptEn) return;
          const key = `${emp.deptKo}|||${emp.deptEn}`;
          if (!seen.has(key)) seen.set(key, { ko: emp.deptKo || "", en: emp.deptEn || "" });
        });
        return Array.from(seen.values()).sort((a, b) => a.ko.localeCompare(b.ko, "ko"));
      }, [employees]);
      const titlePresets = useMemo(() => {
        const seen = new Map();
        employees.forEach((emp) => {
          if (!emp.titleKo && !emp.titleEn) return;
          const key = `${emp.titleKo}|||${emp.titleEn}`;
          if (!seen.has(key)) seen.set(key, { ko: emp.titleKo || "", en: emp.titleEn || "" });
        });
        return Array.from(seen.values()).sort((a, b) => a.ko.localeCompare(b.ko, "ko"));
      }, [employees]);

      const openNewForm = () => {
        setForm(emptyForm);
        setEditingIndex(null);
        setFormError("");
        setShowForm(true);
      };

      const openEditForm = (emp) => {
        const realIndex = employees.indexOf(emp);
        setForm({
          name: emp.name || "",
          birth: emp.birth || "",
          nameKo: emp.nameKo || "",
          nameEn: emp.nameEn || "",
          deptKo: emp.deptKo || "",
          deptEn: emp.deptEn || "",
          titleKo: emp.titleKo || "",
          titleEn: emp.titleEn || "",
          mobile: emp.mobile || "",
          email: emp.email || "",
          location: emp.location || "hq",
          hasJapanese: !!(emp.nameJaGroups && emp.nameJaGroups.length > 0),
          nameJaGroups: emp.nameJaGroups && emp.nameJaGroups.length > 0
            ? emp.nameJaGroups.map((g) => ({ kanji: g.kanji || "", kana: g.kana || "" }))
            : [],
          deptJa: emp.deptJa || "",
          titleJa: emp.titleJa || ""
        });
        setEditingIndex(realIndex);
        setFormError("");
        setShowForm(true);
      };

      const closeForm = () => {
        if (saving) return;
        setShowForm(false);
        setFormError("");
      };

      const handleFormSubmit = (e) => {
        e.preventDefault();
        setFormError("");
        const required = ["name", "birth", "nameKo", "nameEn", "deptKo", "deptEn", "titleKo", "titleEn", "mobile", "email"];
        const missing = required.filter((k) => !String(form[k]).trim());
        if (missing.length > 0) {
          setFormError("모든 필수 항목을 입력해 주세요 (일본어 정보는 선택 사항입니다).");
          return;
        }
        if (!/^\d{4}$/.test(form.birth.trim())) {
          setFormError("생년월일은 MMDD 형식의 숫자 4자리로 입력해 주세요 (예: 0520).");
          return;
        }
        // 성명+생년월일 조합은 명함/서명 생성기의 본인 인증 키로 사용되므로 중복이 없어야 함
        const dup = employees.some((emp, idx) =>
          idx !== editingIndex &&
          String(emp.name || "").trim() === form.name.trim() &&
          String(emp.birth || "").trim() === form.birth.trim()
        );
        if (dup) {
          setFormError("동일한 성명 + 생년월일 조합의 임직원이 이미 등록되어 있습니다. (본인 인증 키가 중복되면 안 됩니다)");
          return;
        }

        const record = {
          name: form.name.trim(),
          birth: form.birth.trim(),
          nameKo: form.nameKo.trim(),
          nameEn: form.nameEn.trim(),
          deptKo: form.deptKo.trim(),
          deptEn: form.deptEn.trim(),
          titleKo: form.titleKo.trim(),
          titleEn: form.titleEn.trim(),
          mobile: form.mobile.trim(),
          email: form.email.trim(),
          location: form.location
        };
        if (form.hasJapanese) {
          const cleanGroups = form.nameJaGroups
            .map((g) => ({ kanji: g.kanji.trim(), kana: g.kana.trim() }))
            .filter((g) => g.kanji || g.kana);
          if (cleanGroups.length > 0) record.nameJaGroups = cleanGroups;
          if (form.deptJa.trim()) record.deptJa = form.deptJa.trim();
          if (form.titleJa.trim()) record.titleJa = form.titleJa.trim();
        }

        const existing = editingIndex === null ? null : employees[editingIndex];
        setSaving(true);
        DB.save(record, existing)
          .then(() => {
            setShowForm(false);
            showToast(existing ? `${record.name}님의 정보를 수정했습니다. 명함·서명 생성기에도 바로 반영됩니다.` : `${record.name}님을 등록했습니다. 명함·서명 생성기에서 바로 사용할 수 있습니다.`);
          })
          .catch(() => setFormError("저장하지 못했습니다. 인터넷 연결이나 로그인 상태를 확인해 주세요."))
          .finally(() => setSaving(false));
      };

      const confirmDelete = () => {
        const target = employees[deleteTarget];
        if (!target) { setDeleteTarget(null); return; }
        setDeleting(true);
        DB.remove(target)
          .then(() => { setDeleteTarget(null); showToast(`${target.name}님의 정보를 삭제했습니다.`); })
          .catch(() => showToast("삭제하지 못했습니다. 다시 시도해 주세요."))
          .finally(() => setDeleting(false));
      };

      const addJaGroupRow = () => {
        setForm((f) => ({ ...f, nameJaGroups: [...f.nameJaGroups, { kanji: "", kana: "" }] }));
      };
      const removeJaGroupRow = (idx) => {
        setForm((f) => ({ ...f, nameJaGroups: f.nameJaGroups.filter((_, i) => i !== idx) }));
      };
      const updateJaGroupRow = (idx, key, value) => {
        setForm((f) => {
          const next = [...f.nameJaGroups];
          next[idx] = { ...next[idx], [key]: value };
          return { ...f, nameJaGroups: next };
        });
      };

      // 백업용: 현재 명단을 예전과 같은 employees.json 형식으로 내려받기
      // employees.json 파일을 골라서 Firebase로 불러오기 (이미 있는 성명+생일은 건너뜀)
      const handleImportFile = (e) => {
        const file = e.target.files && e.target.files[0];
        e.target.value = "";
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          const text = String(reader.result || "").replace(/^\uFEFF/, "").trim();
          if (/^<(!doctype|html)/i.test(text)) { showToast("JSON이 아니라 웹페이지(HTML)가 저장된 파일입니다. GitHub에서 employees.json을 연 뒤 [Raw] 버튼 화면에서 저장하거나, 다운로드(↓) 버튼으로 받아 주세요."); return; }
          let data;
          try { data = JSON.parse(text); } catch (err) { showToast("JSON 문법 오류로 읽지 못했습니다: " + err.message); return; }
          // 배열이 아니면: { employees: [...] } 처럼 감싼 형태나 { id: {...} } 묶음도 받아준다
          let list = data;
          if (!Array.isArray(list) && list && typeof list === "object") {
            const inner = Object.values(list).find((v) => Array.isArray(v));
            list = inner || Object.values(list).filter((v) => v && typeof v === "object" && v.name && v.birth);
          }
          if (!Array.isArray(list) || !list.some((v) => v && v.name && v.birth)) { showToast("파일 안에서 성명(name)과 생일(birth)이 있는 명단을 찾지 못했습니다."); return; }
          setImporting(true);
          DB.importList(list, employees)
            .then((r) => { setSeedFailed(false); showToast(`${r.added}명을 불러왔습니다.` + (r.skipped ? ` (이미 있거나 정보가 빠진 ${r.skipped}명은 건너뜀)` : "")); })
            .catch(() => showToast("불러오지 못했습니다. 로그인 상태와 보안 규칙을 확인해 주세요."))
            .finally(() => setImporting(false));
        };
        reader.readAsText(file);
      };

      const handleDownloadJson = () => {
        const jsonStr = JSON.stringify(employees.map((emp) => DB.clean(emp)), null, 2);
        const blob = new Blob([jsonStr], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `employees-backup-${new Date().toISOString().slice(0, 10)}.json`;
        link.click();
        setTimeout(() => URL.revokeObjectURL(url), 3000);
        showToast(`백업 파일을 내려받았습니다 (총 ${employees.length}명).`);
      };

      if (!isAuthed) {
        return (
          <div className="h-screen flex items-center justify-center bg-[#F8F9FB] p-4">
            <div className="bg-white rounded-2xl shadow-2xl border border-slate-100 max-w-sm w-full p-6 space-y-6">

                <h2 className="text-xl font-bold text-slate-800">임직원 정보 관리자</h2>
                <p className="text-xs text-slate-500">{authChecking ? "로그인 상태를 확인하는 중..." : "관리자 비밀번호를 입력해 주세요."}</p>
              </div>
              <form onSubmit={handlePasswordSubmit} className="space-y-4">
                <div className="relative">
                  <input
                    type={showPw ? "text" : "password"}
                    value={pwInput}
                    onChange={(e) => { setPwInput(e.target.value); setPwError(""); }}
                    placeholder="관리자 비밀번호"
                    className="w-full bg-slate-50 border border-slate-200 rounded-xl pl-3.5 pr-11 py-2.5 text-xs font-semibold focus:outline-none focus:border-[#FF4747] transition-all"
                    autoFocus
                    required
                  />
                  <button
                    type="button"
                    onClick={() => setShowPw((v) => !v)}
                    aria-label={showPw ? "비밀번호 숨기기" : "비밀번호 보기"}
                    aria-pressed={showPw}
                    title={showPw ? "비밀번호 숨기기" : "비밀번호 보기"}
                    className={`absolute right-1.5 top-1/2 -translate-y-1/2 w-8 h-8 rounded-lg grid place-items-center transition-all ${showPw ? "text-[#FF4747] bg-red-50" : "text-slate-400 hover:text-[#FF4747] hover:bg-red-50"}`}
                  >
                    {showPw ? (
                      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-2.2 3.1" /><path d="M6.6 6.6C3.8 8.4 2 12 2 12s3.5 7 10 7a9.7 9.7 0 0 0 5.4-1.6" /><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" /><path d="M2 2l20 20" /></svg>
                    ) : (
                      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" /><circle cx="12" cy="12" r="3" /></svg>
                    )}
                  </button>
                </div>
                {pwError && (
                  <div className="p-3 bg-red-50 border border-red-100 rounded-xl text-red-600 text-xs font-semibold text-center">
                    {pwError}
                  </div>
                )}
                <button
                  type="submit"
                  disabled={signingIn || authChecking}
                  className="w-full py-3 bg-[#FF4747] hover:bg-[#FF4747]/90 text-white rounded-xl text-xs font-bold transition-all shadow-md shadow-red-100 disabled:opacity-60"
                >
                  {signingIn ? "확인 중..." : "확인"}
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-[#F8F9FB] text-slate-800 font-sans pb-16">
          <header className="bg-white/80 backdrop-blur-xl border-b border-slate-200/60 px-4 sm:px-6 py-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 sticky top-0 z-10 shadow-[0_1px_3px_rgba(0,0,0,0.01)]">
            <div>
              <span className="text-base font-bold tracking-tight bg-gradient-to-r from-slate-900 to-slate-700 bg-clip-text text-transparent">임직원 정보 관리자</span>
              <p className="text-[10px] text-slate-400 font-medium">명함 · 이메일 서명 생성기가 함께 사용하는 임직원 명단 관리 (Firebase 실시간 저장)</p>
            </div>
            <div className="flex items-center gap-2">
              <button
                onClick={openNewForm}
                disabled={loadState !== "loaded"}
                className="flex-1 sm:flex-none whitespace-nowrap px-4 py-2 bg-[#FF4747] hover:bg-[#FF4747]/90 text-white rounded-xl text-xs font-bold transition-all shadow-md shadow-red-100 disabled:opacity-50"
              >
                + 신규 등록
              </button>
              <input ref={importInputRef} type="file" accept="application/json,.json" className="hidden" onChange={handleImportFile} />
              <button
                onClick={() => importInputRef.current && importInputRef.current.click()}

                className="flex-1 sm:flex-none whitespace-nowrap px-4 py-2 bg-white hover:bg-slate-50 text-slate-600 border border-slate-200 rounded-xl text-xs font-bold transition-all disabled:opacity-50"

            </div>
          </header>

          {toastMsg && (

                </span>
                <input

              <div className="flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-4">

                    <button
                      key={opt.v}

                      className={`px-3 py-1 rounded-full text-[11px] font-bold transition-all ${locationFilter === opt.v ? "bg-slate-800 text-white" : "bg-slate-100 text-slate-500 hover:bg-slate-200"}`}
                    >

                    </button>

                <div className="flex items-center gap-1.5 flex-wrap">
                  <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider shrink-0">부서</span>
                  <button
                    onClick={() => setDeptFilter("all")}
                    className={`px-3 py-1 rounded-full text-[11px] font-bold transition-all ${deptFilter === "all" ? "bg-slate-800 text-white" : "bg-slate-100 text-slate-500 hover:bg-slate-200"}`}
                  >
                    전체
                  </button>
                  {DEPT_CATEGORIES.map((cat) => (
                    <button
                      key={cat}
                      onClick={() => setDeptFilter(cat)}
                      className={`px-3 py-1 rounded-full text-[11px] font-bold transition-all ${deptFilter === cat ? "bg-slate-800 text-white" : "bg-slate-100 text-slate-500 hover:bg-slate-200"}`}
                    >
                      {cat}
                    </button>
                  ))}
                </div>
              </div>
            </div>

            {/* 데스크탑(md 이상): 화면 전체 너비를 쓰는 표 */}
            <div className="hidden md:block overflow-x-auto">
              <table className="w-full text-xs table-fixed">
                <colgroup>
                  <col style={{width: "4.848485%"}} />
                  <col style={{width: "3.636364%"}} />
                  <col style={{width: "5.454545%"}} />
                  <col style={{width: "9.090909%"}} />
                  <col style={{width: "8.484848%"}} />
                  <col style={{width: "12.121212%"}} />
                  <col style={{width: "9.090909%"}} />
                  <col style={{width: "13.333333%"}} />
                  <col style={{width: "7.878788%"}} />
                  <col style={{width: "11.515152%"}} />
                  <col style={{width: "5.454545%"}} />
                  <col style={{width: "2.424242%"}} />
                  <col style={{width: "6.666667%"}} />
                </colgroup>
                <thead>
                  <tr className="bg-white border-b-2 border-slate-200 text-slate-400 text-[10px] uppercase tracking-wider">
                    <th className="text-left px-4 py-3 font-bold bg-white">성명</th>
                    <th className="text-left px-4 py-3 font-bold bg-white">생일</th>
                    <th className="text-left px-4 py-3 font-bold bg-white">국문 성명</th>
                    <th className="text-left px-4 py-3 font-bold bg-white">영문 성명</th>
                    <th className="text-left px-4 py-3 font-bold bg-white">국문 부서</th>
                    <th className="text-left px-4 py-3 font-bold bg-white">영문 부서</th>
                    <th className="text-left px-4 py-3 font-bold bg-white">국문 직급</th>
                    <th className="text-left px-4 py-3 font-bold bg-white">영문 직급</th>
                    <th className="text-left px-4 py-3 font-bold bg-white">휴대폰</th>
                    <th className="text-left px-4 py-3 font-bold bg-white">이메일</th>

                  </tr>

                <tbody>
                  {filteredEmployees.map((emp) => (

                        <button onClick={() => setDeleteTarget(employees.indexOf(emp))} className="text-slate-400 hover:text-red-500 font-bold px-2 py-1 transition-all">삭제</button>
                      </td>

                  {filteredEmployees.length === 0 && loadState === "loaded" && (

                      <td colSpan="13" className="text-center py-10 text-slate-400 text-xs">{employees.length === 0 ? "등록된 임직원이 없습니다. [+ 신규 등록]으로 추가해 주세요." : "검색 결과가 없습니다."}</td>

            <div className="md:hidden space-y-3">
              {filteredEmployees.map((emp) => (

                  <div className="flex items-start justify-between mb-2">

                    <div>
                      <label className="text-[10px] font-bold text-slate-400 uppercase block mb-1">성명 (인증용)</label>
                      <input type="text" value={form.name} onChange={(e) => setForm({...form, name: e.target.value})} placeholder="예: 홍길동" className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-semibold focus:outline-none focus:border-[#FF4747]" />
                    </div>
                    <div>
                      <label className="text-[10px] font-bold text-slate-400 uppercase block mb-1">생년월일 MMDD (인증용)</label>
                      <input type="text" maxLength="4" value={form.birth} onChange={(e) => setForm({...form, birth: e.target.value})} placeholder="예: 0520" className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-semibold focus:outline-none focus:border-[#FF4747]" />
                    </div>
                    <div>
                      <label className="text-[10px] font-bold text-slate-400 uppercase block mb-1">국문 성명 (띄어쓰기 포함)</label>
                      <input type="text" value={form.nameKo} onChange={(e) => setForm({...form, nameKo: e.target.value})} placeholder="예: 홍 길 동" className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-semibold focus:outline-none focus:border-[#FF4747]" />
                    </div>
                    <div>
                      <label className="text-[10px] font-bold text-slate-400 uppercase block mb-1">영문 성명</label>
                      <input type="text" value={form.nameEn} onChange={(e) => setForm({...form, nameEn: e.target.value.toUpperCase()})} placeholder="예: HONG, GILDONG" className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-semibold focus:outline-none focus:border-[#FF4747]" />
                    </div>
                    <div>
                      <div className="flex justify-between items-end mb-1">
                        <label className="text-[10px] font-bold text-slate-400 uppercase block">국문 부서(파트)</label>
                        <select
                          value=""
                          onChange={(e) => {
                            const preset = deptPresets[Number(e.target.value)];
                            if (preset) setForm((f) => ({...f, deptKo: preset.ko, deptEn: preset.en}));
                          }}
                          className="text-[9px] bg-white border border-slate-200 rounded px-1.5 py-0.5 text-slate-500 cursor-pointer outline-none max-w-[110px]"
                        >
                          <option value="">기존 부서 선택</option>
                          {deptPresets.map((p, idx) => <option key={idx} value={idx}>{p.ko}</option>)}
                        </select>
                      </div>
                      <input type="text" value={form.deptKo} onChange={(e) => setForm({...form, deptKo: e.target.value})} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-semibold focus:outline-none focus:border-[#FF4747]" />
                    </div>
                    <div>
                      <label className="text-[10px] font-bold text-slate-400 uppercase block mb-1">영문 부서(파트)</label>
                      <input type="text" value={form.deptEn} onChange={(e) => setForm({...form, deptEn: e.target.value})} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-semibold focus:outline-none focus:border-[#FF4747]" />
                    </div>
                    <div>
                      <div className="flex justify-between items-end mb-1">
                        <label className="text-[10px] font-bold text-slate-400 uppercase block">국문 직급</label>
                        <select
                          value=""
                          onChange={(e) => {
                            const preset = titlePresets[Number(e.target.value)];
                            if (preset) setForm((f) => ({...f, titleKo: preset.ko, titleEn: preset.en}));
                          }}
                          className="text-[9px] bg-white border border-slate-200 rounded px-1.5 py-0.5 text-slate-500 cursor-pointer outline-none max-w-[110px]"
                        >
                          <option value="">기존 직급 선택</option>
                          {titlePresets.map((p, idx) => <option key={idx} value={idx}>{p.ko}</option>)}
                        </select>
                      </div>
                      <input type="text" value={form.titleKo} onChange={(e) => setForm({...form, titleKo: e.target.value})} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-semibold focus:outline-none focus:border-[#FF4747]" />
                    </div>
                    <div>
                      <label className="text-[10px] font-bold text-slate-400 uppercase block mb-1">영문 직급</label>
                      <input type="text" value={form.titleEn} onChange={(e) => setForm({...form, titleEn: e.target.value})} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-semibold focus:outline-none focus:border-[#FF4747]" />
                    </div>
                    <div>
                      <label className="text-[10px] font-bold text-slate-400 uppercase block mb-1">휴대폰 (+82. 뒤)</label>
                      <div className="relative flex items-center">
                        <span className="absolute left-3 text-xs font-bold text-slate-400 select-none pointer-events-none">+82.</span>
                        <input type="text" value={form.mobile} onChange={(e) => setForm({...form, mobile: e.target.value})} placeholder="10.1234.5678" className="w-full bg-slate-50 border border-slate-200 rounded-xl pl-11 pr-3 py-2 text-xs font-semibold focus:outline-none focus:border-[#FF4747]" />
                      </div>
                    </div>
                    <div>
                      <label className="text-[10px] font-bold text-slate-400 uppercase block mb-1">이메일 (@clerobotics.com 앞부분)</label>
                      <div className="relative flex items-center">
                        <input type="text" value={form.email} onChange={(e) => setForm({...form, email: e.target.value})} placeholder="hong" className="w-full bg-slate-50 border border-slate-200 rounded-xl pl-3 pr-28 py-2 text-xs font-semibold text-right focus:outline-none focus:border-[#FF4747]" />
                        <span className="absolute right-3 text-[10px] font-bold text-slate-400 select-none pointer-events-none">@clerobotics.com</span>
                      </div>
                    </div>
                    <div>
                      <label className="text-[10px] font-bold text-slate-400 uppercase block mb-1">근무지</label>
                      <div className="flex gap-1 bg-slate-100 p-1 rounded-xl">
                        {LOCATION_OPTIONS.map((opt) => (
                          <button
                            key={opt.value}
                            type="button"
                            onClick={() => setForm({...form, location: opt.value})}
                            className={`flex-1 py-1.5 rounded-lg text-[11px] font-bold transition-all ${form.location === opt.value ? "bg-white text-slate-800 shadow-sm border border-slate-200/50" : "text-slate-500"}`}
                          >
                            {opt.label}
                          </button>
                        ))}
                      </div>
                    </div>
                  </div>

                  <div className="border-t border-slate-100 pt-4">
                    <label className="flex items-center gap-2 cursor-pointer">
                      <input type="checkbox" checked={form.hasJapanese} onChange={(e) => setForm({...form, hasJapanese: e.target.checked})} className="w-4 h-4 accent-[#FF4747]" />
                      <span className="text-xs font-bold text-slate-600">일본어 명함 지원 (선택 - 일부 임직원만 해당)</span>
                    </label>
                    {form.hasJapanese && (
                      <div className="mt-3 space-y-3 bg-slate-50 p-3 rounded-xl border border-slate-200/50">
                        <div className="grid grid-cols-2 gap-3">
                          <div>
                            <label className="text-[10px] font-bold text-slate-400 uppercase block mb-1">일문 부서</label>
                            <input type="text" value={form.deptJa} onChange={(e) => setForm({...form, deptJa: e.target.value})} placeholder="예: 成長戦略|人事" className="w-full bg-white border border-slate-200 rounded-lg px-2.5 py-1.5 text-xs font-semibold focus:outline-none" />
                          </div>
                          <div>
                            <label className="text-[10px] font-bold text-slate-400 uppercase block mb-1">일문 직급</label>
                            <input type="text" value={form.titleJa} onChange={(e) => setForm({...form, titleJa: e.target.value})} placeholder="예: シニア マネージャ" className="w-full bg-white border border-slate-200 rounded-lg px-2.5 py-1.5 text-xs font-semibold focus:outline-none" />
                          </div>
                        </div>
                        <div>
                          <div className="flex items-center justify-between mb-1">
                            <label className="text-[10px] font-bold text-slate-400 uppercase block">한자 이름 - 가타카나 읽기 (글자 단위)</label>
                            <button type="button" onClick={addJaGroupRow} className="text-[10px] font-bold text-[#FF4747]">+ 글자 추가</button>
                          </div>
                          <div className="space-y-1.5">
                            {form.nameJaGroups.map((g, idx) => (
                              <div key={idx} className="flex items-center gap-1.5">
                                <input type="text" value={g.kanji} onChange={(e) => updateJaGroupRow(idx, "kanji", e.target.value)} placeholder="漢字" className="w-16 bg-white border border-slate-200 rounded-lg px-2 py-1.5 text-xs font-semibold text-center focus:outline-none" />
                                <span className="text-slate-300 text-xs">→</span>
                                <input type="text" value={g.kana} onChange={(e) => updateJaGroupRow(idx, "kana", e.target.value)} placeholder="カナ" className="w-20 bg-white border border-slate-200 rounded-lg px-2 py-1.5 text-xs font-semibold text-center focus:outline-none" />
                                <button type="button" onClick={() => removeJaGroupRow(idx)} className="text-slate-300 hover:text-red-500 text-xs px-1.5">✕</button>
                              </div>
                            ))}
                            {form.nameJaGroups.length === 0 && (
                              <p className="text-[10px] text-slate-400">글자별로 한자와 가타카나 읽기를 한 쌍씩 추가하세요 (예: 白 → ベク).</p>
                            )}
                          </div>
                        </div>
                      </div>
                    )}
                  </div>

                  {formError && (
                    <div className="p-3 bg-red-50 border border-red-100 rounded-xl text-red-600 text-xs font-semibold text-center">
                      {formError}
                    </div>
                  )}

                  <div className="flex gap-2 pt-2">
                    <button type="button" onClick={closeForm} className="flex-1 py-3 bg-slate-100 hover:bg-slate-200 text-slate-500 rounded-xl text-xs font-bold transition-all">취소</button>
                    <button type="submit" disabled={saving} className="flex-[2] py-3 bg-[#FF4747] hover:bg-[#FF4747]/90 text-white rounded-xl text-xs font-bold transition-all shadow-md shadow-red-100 disabled:opacity-60">
                      {saving ? "저장 중..." : (editingIndex === null ? "등록하기" : "수정 완료")}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* 삭제 확인 모달 */}
          {deleteTarget !== null && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl shadow-2xl border border-slate-100 max-w-sm w-full p-6 space-y-5">
                <div className="text-center space-y-2">
                  <h3 className="text-base font-bold text-slate-800">정말 삭제할까요?</h3>
                  <p className="text-xs text-slate-500">
                    <b>{employees[deleteTarget] && employees[deleteTarget].name}</b>님의 정보가 바로 삭제되며, 명함·서명 생성기에서도 더 이상 조회되지 않습니다.
                  </p>
                </div>
                <div className="flex gap-2">
                  <button onClick={() => setDeleteTarget(null)} disabled={deleting} className="flex-1 py-3 bg-slate-100 hover:bg-slate-200 text-slate-500 rounded-xl text-xs font-bold transition-all">취소</button>
                  <button onClick={confirmDelete} disabled={deleting} className="flex-1 py-3 bg-red-500 hover:bg-red-600 text-white rounded-xl text-xs font-bold transition-all disabled:opacity-60">{deleting ? "삭제 중..." : "삭제"}</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
